<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>AbujaLifestyle</title>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  touch-action:none;
  font-family:Arial,sans-serif;
}

#game{
  position:fixed;
  inset:0;
  width:100vw;
  height:100dvh;
  overflow:hidden;
}

canvas{
  display:block;
  width:100%;
  height:100%;
}

#hud{
  position:absolute;
  top:14px;
  left:14px;
  right:14px;
  display:flex;
  justify-content:space-between;
  z-index:10;
  pointer-events:none;
}

.box{
  color:white;
  background:rgba(0,0,0,.65);
  padding:10px 14px;
  border-radius:12px;
  font-weight:bold;
}

#joystick{
  position:absolute;
  left:22px;
  bottom:25px;
  width:125px;
  height:125px;
  border-radius:50%;
  background:rgba(255,255,255,.15);
  border:2px solid rgba(255,255,255,.35);
  z-index:20;
}

#stick{
  position:absolute;
  width:58px;
  height:58px;
  left:31px;
  top:31px;
  border-radius:50%;
  background:rgba(255,255,255,.7);
}

#action{
  position:absolute;
  right:24px;
  bottom:38px;
  width:90px;
  height:90px;
  border-radius:50%;
  border:3px solid rgba(255,255,255,.5);
  background:rgba(0,0,0,.72);
  color:white;
  font-weight:bold;
  z-index:20;
}

#phone{
  position:absolute;
  right:20px;
  top:72px;
  width:58px;
  height:58px;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.72);
  color:white;
  font-size:25px;
  z-index:20;
}

#status{
  position:absolute;
  left:50%;
  bottom:20px;
  transform:translateX(-50%);
  color:white;
  background:rgba(0,0,0,.65);
  padding:9px 16px;
  border-radius:20px;
  font-size:13px;
  z-index:20;
  pointer-events:none;
}
</style>
</head>

<body>

<div id="game">

<div id="hud">
  <div class="box">🇳🇬 ABUJA</div>
  <div class="box">₦25,000</div>
</div>

<button id="phone">📱</button>

<div id="joystick">
  <div id="stick"></div>
</div>

<button id="action">ACTION</button>

<div id="status">Welcome to Abuja</div>

</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

/* -------------------------
   SCENE
------------------------- */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x7ec8ef);

scene.fog = new THREE.Fog(
  0x7ec8ef,
  80,
  500
);

/* -------------------------
   CAMERA
------------------------- */

const camera = new THREE.PerspectiveCamera(
  60,
  innerWidth / innerHeight,
  0.1,
  1000
);

camera.position.set(0,8,12);

/* -------------------------
   RENDERER
------------------------- */

const renderer = new THREE.WebGLRenderer({
  antialias:true
});

renderer.setPixelRatio(
  Math.min(devicePixelRatio,2)
);

renderer.setSize(
  innerWidth,
  innerHeight
);

renderer.shadowMap.enabled=true;

renderer.shadowMap.type=
  THREE.PCFSoftShadowMap;

document.getElementById("game")
  .appendChild(renderer.domElement);

/* -------------------------
   LIGHT
------------------------- */

const sun = new THREE.DirectionalLight(
  0xffffff,
  3
);

sun.position.set(
  100,
  150,
  100
);

sun.castShadow=true;

scene.add(sun);

const ambient =
  new THREE.HemisphereLight(
    0xffffff,
    0x446644,
    1.5
  );

scene.add(ambient);

/* -------------------------
   GROUND
------------------------- */

const groundGeometry =
  new THREE.PlaneGeometry(
    1000,
    1000
  );

const groundMaterial =
  new THREE.MeshStandardMaterial({
    color:0x4d9347
  });

const ground =
  new THREE.Mesh(
    groundGeometry,
    groundMaterial
  );

ground.rotation.x=-Math.PI/2;

ground.receiveShadow=true;

scene.add(ground);

/* -------------------------
   ROAD
------------------------- */

function createRoad(
  x,
  z,
  width,
  length
){

  const geometry =
    new THREE.PlaneGeometry(
      width,
      length
    );

  const material =
    new THREE.MeshStandardMaterial({
      color:0x292d31
    });

  const road =
    new THREE.Mesh(
      geometry,
      material
    );

  road.rotation.x=-Math.PI/2;

  road.position.set(
    x,
    .02,
    z
  );

  scene.add(road);

  return road;
}

createRoad(
  0,
  0,
  30,
  1000
);

createRoad(
  0,
  0,
  1000,
  30
);

/* -------------------------
   ROAD LINES
------------------------- */

function createLine(
  x,
  z,
  w,
  d
){

  const geometry =
    new THREE.BoxGeometry(
      w,
      .04,
      d
    );

  const material =
    new THREE.MeshBasicMaterial({
      color:0xf3d33b
    });

  const line =
    new THREE.Mesh(
      geometry,
      material
    );

  line.position.set(
    x,
    .06,
    z
  );

  scene.add(line);
}

for(let i=-450;i<450;i+=50){

  createLine(
    0,
    i,
    2,
    25
  );

  createLine(
    i,
    0,
    25,
    2
  );
}

/* -------------------------
   BUILDINGS
------------------------- */

function createBuilding(
  x,
  z,
  w,
  h,
  d,
  color
){

  const geometry =
    new THREE.BoxGeometry(
      w,
      h,
      d
    );

  const material =
    new THREE.MeshStandardMaterial({
      color:color
    });

  const building =
    new THREE.Mesh(
      geometry,
      material
    );

  building.position.set(
    x,
    h/2,
    z
  );

  building.castShadow=true;
  building.receiveShadow=true;

  scene.add(building);

  /* windows */

  const windowMaterial =
    new THREE.MeshBasicMaterial({
      color:0x71b9d9
    });

  for(
    let y=4;
    y<h-2;
    y+=5
  ){

    for(
      let xx=-w/2+3;
      xx<w/2-2;
      xx+=5
    ){

      const windowGeometry =
        new THREE.BoxGeometry(
          2,
          2,
          .08
        );

      const windowMesh =
        new THREE.Mesh(
          windowGeometry,
          windowMaterial
        );

      windowMesh.position.set(
        x+xx,
        y,
        z-d/2-.05
      );

      scene.add(windowMesh);
    }
  }
}

/* Abuja buildings */

createBuilding(
  -55,-55,
  35,45,35,
  0xd0b38c
);

createBuilding(
  60,-60,
  42,60,38,
  0xd8d2bd
);

createBuilding(
  -65,65,
  38,50,40,
  0xc89082
);

createBuilding(
  65,70,
  45,70,42,
  0xc8c8c8
);

createBuilding(
  -120,-130,
  50,80,45,
  0xb7b7b7
);

/* -------------------------
   TREES
------------------------- */

function createTree(x,z){

  const trunk =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        .6,
        .8,
        5
      ),
      new THREE.MeshStandardMaterial({
        color:0x70452a
      })
    );

  trunk.position.set(
    x,
    2.5,
    z
  );

  trunk.castShadow=true;

  scene.add(trunk);

  const leaves =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        4,
        12,
        12
      ),
      new THREE.MeshStandardMaterial({
        color:0x277b36
      })
    );

  leaves.position.set(
    x,
    7,
    z
  );

  leaves.castShadow=true;

  scene.add(leaves);
}

for(
  let i=0;
  i<30;
  i++
){

  const x =
    (Math.random()-.5)*350;

  const z =
    (Math.random()-.5)*350;

  createTree(x,z);
}

/* -------------------------
   PLAYER
------------------------- */

const player =
  new THREE.Group();

scene.add(player);

const body =
  new THREE.Mesh(
    new THREE.CapsuleGeometry(
      .7,
      1.8,
      6,
      12
    ),
    new THREE.MeshStandardMaterial({
      color:0x202020
    })
  );

body.position.y=2;

body.castShadow=true;

player.add(body);

const head =
  new THREE.Mesh(
    new THREE.SphereGeometry(
      .65,
      20,
      20
    ),
    new THREE.MeshStandardMaterial({
      color:0x8b542f
    })
  );

head.position.y=3.7;

head.castShadow=true;

player.add(head);

/* hair */

const hair =
  new THREE.Mesh(
    new THREE.SphereGeometry(
      .67,
      16,
      16
    ),
    new THREE.MeshStandardMaterial({
      color:0x111111
    })
  );

hair.scale.y=.45;

hair.position.y=4.05;

player.add(hair);

player.position.set(
  0,
  0,
  20
);

/* -------------------------
   RANGE ROVER
------------------------- */

const car =
  new THREE.Group();

scene.add(car);

const carBody =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      5,
      1.7,
      8
    ),
    new THREE.MeshStandardMaterial({
      color:0x111111,
      metalness:.7,
      roughness:.25
    })
  );

carBody.position.y=1.4;

carBody.castShadow=true;

car.add(carBody);

/* roof */

const roof =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      4.3,
      1.1,
      4.8
    ),
    new THREE.MeshStandardMaterial({
      color:0x181818,
      metalness:.5,
      roughness:.2
    })
  );

roof.position.y=2.6;

roof.castShadow=true;

car.add(roof);

/* windows */

const glass =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      4.35,
      .9,
      4.9
    ),
    new THREE.MeshStandardMaterial({
      color:0x18313e,
      metalness:.3,
      roughness:.15
    })
  );

glass.position.y=2.65;

car.add(glass);

/* wheels */

function wheel(z){

  const wheel =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        .9,
        .9,
        .6,
        20
      ),
      new THREE.MeshStandardMaterial({
        color:0x080808
      })
    );

  wheel.rotation.z=
    Math.PI/2;

  wheel.position.set(
    2.5,
    .8,
    z
  );

  wheel.castShadow=true;

  car.add(wheel);

  const wheel2=
    wheel.clone();

  wheel2.position.x=-2.5;

  car.add(wheel2);
}

wheel(2.6);
wheel(-2.6);

car.position.set(
  8,
  0,
  18
);

/* -------------------------
   CONTROLS
------------------------- */

let moveX=0;
let moveY=0;

const joystick =
  document.getElementById(
    "joystick"
  );

const stick =
  document.getElementById(
    "stick"
  );

function moveJoystick(
  clientX,
  clientY
){

  const rect=
    joystick.getBoundingClientRect();

  const centerX=
    rect.left+rect.width/2;

  const centerY=
    rect.top+rect.height/2;

  let dx=
    clientX-centerX;

  let dy=
    clientY-centerY;

  const max=45;

  const distance=
    Math.sqrt(
      dx*dx+dy*dy
    );

  if(distance>max){

    dx=
      dx/distance*max;

    dy=
      dy/distance*max;
  }

  stick.style.transform=
    `translate(${dx}px,${dy}px)`;

  moveX=dx/max;
  moveY=dy/max;
}

function stopJoystick(){

  moveX=0;
  moveY=0;

  stick.style.transform=
    "translate(0,0)";
}

joystick.addEventListener(
  "touchstart",
  e=>{

    e.preventDefault();

    const t=e.touches[0];

    moveJoystick(
      t.clientX,
      t.clientY
    );

  },
  {passive:false}
);

joystick.addEventListener(
  "touchmove",
  e=>{

    e.preventDefault();

    const t=e.touches[0];

    moveJoystick(
      t.clientX,
      t.clientY
    );

  },
  {passive:false}
);

joystick.addEventListener(
  "touchend",
  e=>{

    e.preventDefault();

    stopJoystick();

  },
  {passive:false}
);

/* -------------------------
   ACTION
------------------------- */

let driving=false;

document.getElementById(
  "action"
).addEventListener(
  "touchstart",
  e=>{

    e.preventDefault();

    const distance=
      player.position.distanceTo(
        car.position
      );

    if(!driving && distance<7){

      driving=true;

      document.getElementById(
        "status"
      ).textContent=
        "Driving Range Rover";

    }else if(driving){

      driving=false;

      player.position.copy(
        car.position
      );

      player.position.x-=6;

      document.getElementById(
        "status"
      ).textContent=
        "Walking around Abuja";

    }else{

      document.getElementById(
        "status"
      ).textContent=
        "Move closer to the Range Rover";

    }

  },
  {passive:false}
);

/* -------------------------
   GAME LOOP
------------------------- */

function animate(){

  requestAnimationFrame(
    animate
  );

  if(driving){

    car.position.x+=
      moveX*.35;

    car.position.z+=
      moveY*.35;

    if(
      Math.abs(moveX)+
      Math.abs(moveY)>0
    ){

      car.rotation.y=
        Math.atan2(
          moveX,
          moveY
        );
    }

  }else{

    player.position.x+=
      moveX*.14;

    player.position.z+=
      moveY*.14;

    if(
      Math.abs(moveX)+
      Math.abs(moveY)>0
    ){

      player.rotation.y=
        Math.atan2(
          moveX,
          moveY
        );
    }
  }

  /* camera follows */

  const target=
    driving ?
    car.position :
    player.position;

  const desiredCamera=
    new THREE.Vector3(
      target.x,
      target.y+7,
      target.z+12
    );

  camera.position.lerp(
    desiredCamera,
    .08
  );

  camera.lookAt(
    target.x,
    target.y+1.5,
    target.z
  );

  renderer.render(
    scene,
    camera
  );
}

animate();

/* -------------------------
   PHONE
------------------------- */

document.getElementById(
  "phone"
).addEventListener(
  "touchstart",
  e=>{

    e.preventDefault();

    document.getElementById(
      "status"
    ).textContent=
      "Phone coming soon";

  },
  {passive:false}
);

/* -------------------------
   RESIZE
------------------------- */

addEventListener(
  "resize",
  ()=>{

    camera.aspect=
      innerWidth/
      innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );

  }
);

</script>

</body>
</html>
