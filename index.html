<!DOCTYPE html>
<html lang="en">

<title>AbujaLifestyle</title>

<style>

}
canvas{display:block;width:100%;height:100%}

#online,#title,#insideLabel,#hint,#interaction,#exit,#controls{
  position:fixed;
  z-index:50;

#online{
  top:12px;left:12px;

#title{

#insideLabel{
  display:none;

}

#controls{

}

.btn{

}

#up{left:66px;top:0}
#down{left:66px;bottom:0}

/* =====================================================
   ERROR DISPLAY
===================================================== */

function showError(message){
  const box=document.getElementById("online");
  box.textContent="GAME ERROR: "+message;
  box.style.background="#c62828";
  box.style.maxWidth="90vw";
  console.error(message);
}

window.addEventListener("error",function(e){
  showError(e.message || "Unknown error");
});

window.addEventListener("unhandledrejection",function(e){
  showError(
    e.reason && e.reason.message
      ? e.reason.message
      : String(e.reason)
  );
});

/* =====================================================
   BUILDINGS
===================================================== */

const buildingColors=[
  0xd8c5a8,
  0xc6c6c6,
  0xe1d3ba,
  0xb8c1c8,
  0xd1b08a,
  0xaeb9aa
];

function building(x,z,w,d,h){

  const body=new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    mat(
      buildingColors[
        Math.floor(
          Math.random()*buildingColors.length
        )
      ]
    )
  );

  body.position.set(x,h/2,z);
  body.castShadow=true;
  body.receiveShadow=true;

  scene.add(body);


  const roof=new THREE.Mesh(
    new THREE.BoxGeometry(w+.5,.35,d+.5),
    mat(0x555555)
  );

  roof.position.set(x,h+.18,z);

  scene.add(roof);


  const glass=mat(0x263b4a,.25);

  const rows=Math.max(1,Math.floor(h/4));
  const cols=Math.max(1,Math.floor(w/3));

  for(let r=0;r<rows;r++){

    for(let c=0;c<cols;c++){

      const wx=x-w/2+1.5+c*3;
      const wy=2.2+r*3.2;

      if(wy>h-1) continue;

      const window=new THREE.Mesh(
        new THREE.BoxGeometry(1.2,1.5,.08),
        glass
      );

      window.position.set(
        wx,
        wy,
        z-d/2-.05
      );

      scene.add(window);

      const back=window.clone();

      back.position.z=z+d/2+.05;

      scene.add(back);
    }
  }
}

/* =====================================================
   MOBILE CONTROLS
===================================================== */

const keys={
  w:false,
  s:false,
  a:false,
  d:false
};

function bindButton(id,key){

  const el=document.getElementById(id);

  el.addEventListener("touchstart",function(e){
    e.preventDefault();
    keys[key]=true;
  },{passive:false});

  el.addEventListener("touchend",function(e){
    e.preventDefault();
    keys[key]=false;
  },{passive:false});

  el.addEventListener("touchcancel",function(){
    keys[key]=false;
  });

  el.addEventListener("mousedown",function(){
    keys[key]=true;
  });

  el.addEventListener("mouseup",function(){
    keys[key]=false;
  });

  el.addEventListener("mouseleave",function(){
    keys[key]=false;
  });
}

bindButton("up","w");
bindButton("down","s");
bindButton("left","a");
bindButton("right","d");


/* Keyboard */

window.addEventListener("keydown",function(e){

  if(e.key==="w" || e.key==="ArrowUp") keys.w=true;
  if(e.key==="s" || e.key==="ArrowDown") keys.s=true;
  if(e.key==="a" || e.key==="ArrowLeft") keys.a=true;
  if(e.key==="d" || e.key==="ArrowRight") keys.d=true;
});

window.addEventListener("keyup",function(e){

  if(e.key==="w" || e.key==="ArrowUp") keys.w=false;
  if(e.key==="s" || e.key==="ArrowDown") keys.s=false;
  if(e.key==="a" || e.key==="ArrowLeft") keys.a=false;
  if(e.key==="d" || e.key==="ArrowRight") keys.d=false;
});


/* =====================================================
   CAMERA
===================================================== */

let cameraOrbit=0;
let cameraPitch=.45;

let touching=false;
let lastX=0;
let lastY=0;

canvas.addEventListener("touchstart",function(e){

  if(e.touches.length!==1)return;

  touching=true;

  lastX=e.touches[0].clientX;
  lastY=e.touches[0].clientY;
},{passive:true});


canvas.addEventListener("touchmove",function(e){

  if(!touching || e.touches.length!==1)return;

  const x=e.touches[0].clientX;
  const y=e.touches[0].clientY;

  const dx=x-lastX;
  const dy=y-lastY;

  cameraOrbit-=dx*.006;

  cameraPitch-=dy*.004;

  cameraPitch=Math.max(.15,Math.min(1.1,cameraPitch));

  lastX=x;
  lastY=y;
},{passive:true});


canvas.addEventListener("touchend",function(){
  touching=false;
},{passive:true});


/* =====================================================
   HOUSE ENTER / EXIT
===================================================== */

let inside=false;

const interaction=document.getElementById("interaction");
const exitButton=document.getElementById("exit");
const insideLabel=document.getElementById("insideLabel");

function distanceToHouse(){

  const dx=
    car.group.position.x-house.x;

  const dz=
    car.group.position.z-house.doorZ;

  return Math.sqrt(dx*dx+dz*dz);
}

interaction.addEventListener("click",function(){

  inside=true;

  houseGroup.visible=true;

  insideLabel.style.display="block";
  interaction.style.display="none";
  exitButton.style.display="block";
});


exitButton.addEventListener("click",function(){

  inside=false;

  insideLabel.style.display="none";
  exitButton.style.display="none";

  car.group.position.set(
    house.x,
    0,
    house.doorZ-9
  );
});


/* =====================================================
   MULTIPLAYER
===================================================== */

let socket=null;
let myId=null;

const otherPlayers={};

function connectMultiplayer(){

  try{

    const protocol=
      location.protocol==="https:"
      ? "wss:"
      : "ws:";

    socket=new WebSocket(
      protocol+"//"+location.host
    );


    socket.onopen=function(){

      document.getElementById("online").textContent=
        "ONLINE";

      document.getElementById("online").style.background=
        "rgba(0,120,40,.7)";
    };


    socket.onmessage=function(event){

      try{

        const data=JSON.parse(event.data);


        if(data.type==="welcome"){

          myId=data.id;
        }


        if(data.type==="players"){

          const active={};


          for(const id in data.players){

            if(id===myId)continue;

            active[id]=true;

            if(!otherPlayers[id]){

              const p=new THREE.Mesh(
                new THREE.BoxGeometry(2,1.4,4),
                mat(0x1b3d8f)
              );

              p.position.y=.8;

              scene.add(p);

              otherPlayers[id]=p;
            }


            const p=otherPlayers[id];
            const info=data.players[id];

            p.position.x=info.x;
            p.position.y=info.y+.8;
            p.position.z=info.z;
            p.rotation.y=info.rotation;
          }


          for(const id in otherPlayers){

            if(!active[id]){

              scene.remove(
                otherPlayers[id]
              );

              delete otherPlayers[id];
            }
          }
        }

      }catch(err){

        console.log(err);
      }
    };


    socket.onclose=function(){

      document.getElementById("online").textContent=
        "OFFLINE";

      document.getElementById("online").style.background=
        "rgba(120,70,0,.7)";
    };


    socket.onerror=function(){

      document.getElementById("online").textContent=
        "OFFLINE";
    };

  }catch(err){

    document.getElementById("online").textContent=
      "OFFLINE";
  }
}


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener("resize",function(){

  camera.aspect=
    innerWidth/innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    innerWidth,
    innerHeight
  );
});


/* =====================================================
   GAME LOOP
===================================================== */

function animate(){

  requestAnimationFrame(animate);


  /* Drive */

  car.update(keys);


  /* Multiplayer position */

  if(
    socket &&
    socket.readyState===WebSocket.OPEN
  ){

    socket.send(
      JSON.stringify({
        type:"position",
        x:car.group.position.x,
        y:car.group.position.y,
        z:car.group.position.z,
        rotation:car.group.rotation.y
      })
    );
  }


  /* House interaction */

  if(!inside){

    const distance=distanceToHouse();

    if(distance<12){

      interaction.style.display="block";

    }else{

      interaction.style.display="none";
    }
  }


  /* Camera */

  const target=car.group.position.clone();

  target.y+=1.8;


  const distance=inside ? 8 : 11;

  const horizontal=
    Math.cos(cameraPitch)*distance;

  const vertical=
    Math.sin(cameraPitch)*distance;


  const camX=
    target.x+
    Math.sin(cameraOrbit)*
    horizontal;

  const camZ=
    target.z+
    Math.cos(cameraOrbit)*
    horizontal;


  camera.position.x+=
    (camX-camera.position.x)*.08;

  camera.position.y+=
    (target.y+vertical-camera.position.y)*.08;

  camera.position.z+=
    (camZ-camera.position.z)*.08;


  camera.lookAt(target);


  renderer.render(
    scene,
    camera
  );
}

document.getElementById("online").textContent=
  "LOADING WORLD...";

connectMultiplayer();

animate();

document.getElementById("online").textContent=
  "CONNECTING...";

}catch(error){

  showError(
    error.message ||
    String(error)
  );

}
