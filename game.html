// ROAD COLLISION
// The city has four main road corridors. Keep the SUV on paved road
// instead of letting it drive across the grass.
function isOnRoad(x,z){
  const mainVertical = Math.abs(x) <= 10.6 && Math.abs(z) <= 300;
  const mainHorizontal = Math.abs(z) <= 10.6 && Math.abs(x) <= 300;

  const eastVertical = Math.abs(x-70) <= 6.7 && Math.abs(z) <= 150;
  const westVertical = Math.abs(x+70) <= 6.7 && Math.abs(z) <= 150;
  const northHorizontal = Math.abs(z-70) <= 6.7 && Math.abs(x) <= 150;
  const southHorizontal = Math.abs(z+70) <= 6.7 && Math.abs(x) <= 150;

  return mainVertical || mainHorizontal ||
         eastVertical || westVertical ||
         northHorizontal || southHorizontal;
}

const carNextPosition = new THREE.Vector3();

function tryMoveCar(distance){
  carNextPosition.copy(car.position);

  // Rotation 0 means the SUV faces toward -Z.
  carNextPosition.x -= Math.sin(car.rotation.y) * distance;
  carNextPosition.z -= Math.cos(car.rotation.y) * distance;

  const margin=2.0;
  const points=[
    [0,0],[margin,0],[-margin,0],[0,margin],[0,-margin]
  ];

  for(const [px,pz] of points){
    if(!isOnRoad(carNextPosition.x+px,carNextPosition.z+pz)){
      carSpeed *= 0.55;
      return false;
    }
  }

  car.position.copy(carNextPosition);
  return true;
}

function updateCar(){
  if(!driving) return;

  const throttle=-moveY;
  const hasThrottle=Math.abs(throttle)>.045;

  if(hasThrottle){
    const acceleration=throttle>=0 ? 0.038 : 0.050;
    carSpeed += throttle*acceleration;
  }else{
    carSpeed *= 0.955;
  }

  carSpeed=Math.max(-0.55,Math.min(1.35,carSpeed));

  const steering=Math.max(-1,Math.min(1,moveX));
  carSteer += (steering-carSteer)*0.22;

  if(Math.abs(carSpeed)>0.006){
    const speedRatio=Math.min(Math.abs(carSpeed)/1.35,1);
    const steeringStrength=.014 + speedRatio*.052;

    car.rotation.y +=
      carSteer*steeringStrength*(carSpeed>=0 ? 1 : -0.72);

    // Front wheels visibly follow the steering input.
    wheels[0].rotation.y=carSteer*.55;
    wheels[1].rotation.y=carSteer*.55;

    if(!tryMoveCar(carSpeed)) carSpeed=0;
  }

  if(Math.abs(steering)<.04) carSteer *= .88;

  if(!hasThrottle && Math.abs(carSpeed)<.018) carSpeed=0;

  document.getElementById("status").textContent =
    driving
      ? `Driving • SUV • ${Math.round(Math.abs(carSpeed)*82)} km/h`
      : "Explore Abuja";
}

  cabin.position.set(0,1.0,.15);
  cabin.castShadow=true;
  g.add(cabin);

  for(const wx of [-.86,.86]){
    for(const wz of [-.98,.98]){
      const w=new THREE.Mesh(
        new THREE.CylinderGeometry(.25,.25,.18,12),
        new THREE.MeshStandardMaterial({color:0x090909,roughness:.7})
      );
      w.rotation.z=Math.PI/2;
      w.position.set(wx,.45,wz);
      g.add(w);
    }
  }

  g.position.set(x,0,z);
  scene.add(g);
  trafficCars.push({mesh:g,axis,dir});
}

function updateCityLife(){
  const t=performance.now()*.001;

  for(const npc of cityNPCs){
    const sway=Math.sin(t*.7+npc.phase)*1.8*npc.direction;
    npc.mesh.position.x=npc.baseX+sway;
    npc.mesh.position.z=npc.baseZ+Math.sin(t*.5+npc.phase)*.8;
    npc.mesh.rotation.y=Math.sin(t*.7+npc.phase)*.35;
  }

  for(const traffic of trafficCars){
    const speed=.055*traffic.dir;
    if(traffic.axis==="z"){
      traffic.mesh.position.z+=speed;
      if(traffic.mesh.position.z>125) traffic.mesh.position.z=-125;
      if(traffic.mesh.position.z<-125) traffic.mesh.position.z=125;
    }else{
      traffic.mesh.position.x+=speed;
      if(traffic.mesh.position.x>125) traffic.mesh.position.x=-125;
      if(traffic.mesh.position.x<-125) traffic.mesh.position.x=125;
    }
  }
}

let moveX=0;
let moveY=0;

let driving=false;


const joystick =
document.getElementById(
"joystick"
);

const stick =
document.getElementById(
"stick"
);

let joystickTouch=null;


joystick.addEventListener(
"touchstart",
e=>{

e.preventDefault();

joystickTouch =
e.changedTouches[0].identifier;

},
{passive:false}
);


joystick.addEventListener(
"touchmove",
e=>{

e.preventDefault();

let t;

for(
const touch of e.changedTouches
){

if(
touch.identifier===joystickTouch
){

t=touch;
break;

}

}

if(!t)return;


const rect =
joystick.getBoundingClientRect();


let dx =
t.clientX-
(rect.left+rect.width/2);

let dy =
t.clientY-
(rect.top+rect.height/2);


const max=42;

const len =
Math.sqrt(
dx*dx+dy*dy
);


if(len>max){

dx=dx/len*max;
dy=dy/len*max;

}


stick.style.transform=
`translate(${dx}px,${dy}px)`;


moveX=dx/max;
moveY=dy/max;

},
{passive:false}
);


joystick.addEventListener(
"touchend",
e=>{

for(
const t of e.changedTouches
){

if(
t.identifier===joystickTouch
){

moveX=0;
moveY=0;

stick.style.transform=
"translate(0,0)";

joystickTouch=null;

}

}

},
{passive:false}
);


/* CAMERA */

let cameraYaw=0;
let cameraPitch=.45;

let cameraTouch=null;

let lastX=0;
let lastY=0;


renderer.domElement.addEventListener(
"touchstart",
e=>{

if(e.touches.length!==1)return;

cameraTouch =
e.touches[0].identifier;

lastX =
e.touches[0].clientX;

lastY =
e.touches[0].clientY;

},
{passive:false}
);


renderer.domElement.addEventListener(
"touchmove",
e=>{

let t=null;

for(
const touch of e.changedTouches
){

if(
touch.identifier===cameraTouch
){

t=touch;
break;

}

}

if(!t)return;

e.preventDefault();


const dx =
t.clientX-lastX;

const dy =
t.clientY-lastY;


lastX=t.clientX;
lastY=t.clientY;


cameraYaw-=dx*.006;

cameraPitch-=dy*.004;


cameraPitch=
Math.max(
.15,
Math.min(
1.15,
cameraPitch
)
);

},
{passive:false}
);

"touchend",

/* MOVEMENT */

const direction =
new THREE.Vector3();

const forward =
new THREE.Vector3();

const right =
new THREE.Vector3();


function updateMovement(){

if(!player || driving)return;

if(
Math.abs(moveX)<.01 &&
Math.abs(moveY)<.01
)return;

forward.set(
-Math.sin(cameraYaw),
0,
-Math.cos(cameraYaw)
);

right.set(
Math.cos(cameraYaw),
0,
-Math.sin(cameraYaw)
);

direction
.set(0,0,0)
.addScaledVector(right,moveX)
.addScaledVector(forward,-moveY);

if(direction.length()>0){
  direction.normalize();

  // Smooth on-foot movement, tuned for mobile.
  const speed=.15;
  player.position.addScaledVector(direction,speed);

  const targetRotation=Math.atan2(direction.x,direction.z);
  player.rotation.y +=
    Math.atan2(
      Math.sin(targetRotation-player.rotation.y),
      Math.cos(targetRotation-player.rotation.y)
    )*.22;
}

}

distance;

target.position.y+
2+

);


camera.position.lerp(
desiredCamera,
.12
);

cameraTarget
);

}

/* MULTIPLAYER */
const remotePlayers = new Map();
let socket = null;
let myPlayerId = null;
function createRemotePlayer(){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.CapsuleGeometry(.42,1.15,6,10),new THREE.MeshStandardMaterial({color:0x1976d2}));
  body.position.y=1; body.castShadow=true; g.add(body);
  const head=new THREE.Mesh(new THREE.SphereGeometry(.32,12,12),new THREE.MeshStandardMaterial({color:0x8d5524}));
  head.position.y=1.85; head.castShadow=true; g.add(head);
  scene.add(g); return g;
}
function connectMultiplayer(){
  const protocol=location.protocol==="https:"?"wss:":"ws:";
  socket=new WebSocket(protocol+"//"+location.host);
  socket.addEventListener("open",()=>document.getElementById("status").textContent="Online • Abuja multiplayer");
  socket.addEventListener("message",(event)=>{
    try{const data=JSON.parse(event.data);
      if(data.type==="welcome"){myPlayerId=data.id;return;}
      if(data.type==="players"){
        const seen=new Set();
        for(const [id,p] of Object.entries(data.players)){
          if(id===myPlayerId)continue; seen.add(id);
          let remote=remotePlayers.get(id);
          if(!remote){remote=createRemotePlayer();remote.position.set(p.x,p.y,p.z);remote.rotation.y=p.rotation||0;remotePlayers.set(id,remote);}
          remote.userData.targetX=p.x; remote.userData.targetY=p.y; remote.userData.targetZ=p.z; remote.userData.targetRotation=p.rotation||0;
        }
        for(const [id,remote] of remotePlayers){if(!seen.has(id)){scene.remove(remote);remotePlayers.delete(id);}}
      }
    }catch(error){console.error("Multiplayer message error",error);}
  });
  socket.addEventListener("close",()=>{document.getElementById("status").textContent="Offline • Reconnecting...";setTimeout(connectMultiplayer,2000);});
  socket.addEventListener("error",()=>document.getElementById("status").textContent="Connection problem");
}
function sendPlayerState(){
  if(!socket||socket.readyState!==WebSocket.OPEN)return;
  const target=driving?car:player;if(!target)return;
  socket.send(JSON.stringify({type:"position",x:target.position.x,y:target.position.y,z:target.position.z,rotation:target.rotation.y}));
}
function updateRemotePlayers(){
  for(const remote of remotePlayers.values()){
    if(remote.userData.targetX===undefined)continue;
    remote.position.x+=(remote.userData.targetX-remote.position.x)*.18;
    remote.position.y+=(remote.userData.targetY-remote.position.y)*.18;
    remote.position.z+=(remote.userData.targetZ-remote.position.z)*.18;
    const r=remote.userData.targetRotation||0;
    remote.rotation.y+=Math.atan2(Math.sin(r-remote.rotation.y),Math.cos(r-remote.rotation.y))*.18;
  }
}
connectMultiplayer();
setInterval(sendPlayerState,100);
