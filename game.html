<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>AbujaLifestyle</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  touch-action:none;
  font-family:Arial,sans-serif;
}
#game{
  position:fixed;
  inset:0;
}
canvas{
  display:block;
  width:100%;
  height:100%;
  touch-action:none;
}

#hud{
  position:fixed;
  top:15px;
  left:15px;
  z-index:10;
  color:white;
  background:rgba(0,0,0,.55);
  padding:10px 14px;
  border-radius:12px;
  font-weight:bold;
}

#status{
  position:fixed;
  top:65px;
  left:15px;
  z-index:10;
  color:white;
  background:rgba(0,0,0,.45);
  padding:8px 12px;
  border-radius:10px;
  font-size:13px;
}

#joystick{
  position:fixed;
  left:25px;
  bottom:30px;
  width:130px;
  height:130px;
  border-radius:50%;
  background:rgba(255,255,255,.15);
  border:2px solid rgba(255,255,255,.3);
  z-index:20;
}

#stick{
  position:absolute;
  width:58px;
  height:58px;
  left:34px;
  top:34px;
  border-radius:50%;
  background:rgba(255,255,255,.7);
}

button{
  position:fixed;
  z-index:20;
  border:0;
  color:white;
  font-weight:bold;
  border-radius:50%;
  width:75px;
  height:75px;
  font-size:13px;
}

#action{
  right:25px;
  bottom:35px;
  background:rgba(20,20,20,.75);
}

#phone{
  right:30px;
  top:20px;
  width:55px;
  height:55px;
  background:rgba(20,20,20,.7);
  font-size:22px;
}

#help{
  position:fixed;
  bottom:8px;
  left:50%;
  transform:translateX(-50%);
  z-index:10;
  color:rgba(255,255,255,.65);
  font-size:11px;
  pointer-events:none;
}
</style>
</head>

<body>

<div id="game"></div>

<div id="hud">
  💵 $<span id="money">500</span>
</div>

<div id="status">
  Drag the screen to look around
</div>

<button id="phone">📱</button>
<button id="action">ACTION</button>

<div id="joystick">
  <div id="stick"></div>
</div>

<div id="help">
  Move • Drag screen to look • ACTION
</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

/* =========================
   BASIC SETUP
========================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x87ceeb);

scene.fog = new THREE.Fog(
  0x87ceeb,
  80,
  300
);

const camera = new THREE.PerspectiveCamera(
  60,
  innerWidth / innerHeight,
  0.1,
  1000
);

const renderer = new THREE.WebGLRenderer({
  antialias:true
});

renderer.setSize(
  innerWidth,
  innerHeight
);

renderer.setPixelRatio(
  Math.min(devicePixelRatio,2)
);

renderer.shadowMap.enabled = true;

document
  .getElementById("game")
  .appendChild(renderer.domElement);


/* =========================
   LIGHT
========================= */

const sun = new THREE.DirectionalLight(
  0xffffff,
  1.5
);

sun.position.set(
  50,
  100,
  50
);

sun.castShadow = true;

scene.add(sun);


const hemi = new THREE.HemisphereLight(
  0xffffff,
  0x555555,
  1
);

scene.add(hemi);


/* =========================
   GROUND
========================= */

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(
    500,
    500
  ),
  new THREE.MeshStandardMaterial({
    color:0x3b7d3c
  })
);

ground.rotation.x = -Math.PI / 2;

ground.receiveShadow = true;

scene.add(ground);


/* =========================
   ROADS
========================= */

function createRoad(
  width,
  depth,
  x,
  z
){

  const road = new THREE.Mesh(
    new THREE.BoxGeometry(
      width,
      .1,
      depth
    ),
    new THREE.MeshStandardMaterial({
      color:0x292929
    })
  );

  road.position.set(
    x,
    .05,
    z
  );

  scene.add(road);
}


createRoad(
  18,
  500,
  0,
  0
);

createRoad(
  500,
  18,
  0,
  0
);


/* =========================
   ROAD LINES
========================= */

function roadLine(
  x,
  z,
  horizontal
){

  const line = new THREE.Mesh(
    new THREE.BoxGeometry(
      horizontal ? 4 : .3,
      .03,
      horizontal ? .3 : 4
    ),
    new THREE.MeshStandardMaterial({
      color:0xffd400
    })
  );

  line.position.set(
    x,
    .12,
    z
  );

  scene.add(line);
}


for(let i=-240;i<240;i+=12){

  roadLine(
    0,
    i,
    false
  );

  roadLine(
    i,
    0,
    true
  );
}


/* =========================
   BUILDINGS
========================= */

function createBuilding(
  x,
  z,
  w,
  h,
  d
){

  const building = new THREE.Mesh(
    new THREE.BoxGeometry(
      w,
      h,
      d
    ),
    new THREE.MeshStandardMaterial({
      color:
        0x777777 +
        Math.floor(Math.random()*0x222222)
    })
  );

  building.position.set(
    x,
    h/2,
    z
  );

  building.castShadow = true;
  building.receiveShadow = true;

  scene.add(building);


  for(
    let yy=3;
    yy<h;
    yy+=4
  ){

    const window = new THREE.Mesh(
      new THREE.BoxGeometry(
        .8,
        1.3,
        .05
      ),
      new THREE.MeshStandardMaterial({
        color:0x78b9e6,
        emissive:0x17384d
      })
    );

    window.position.set(
      x,
      yy,
      z-d/2-.03
    );

    scene.add(window);
  }
}


for(
  let x=-70;
  x<=70;
  x+=25
){

  createBuilding(
    x,
    -55,
    18,
    15+Math.random()*25,
    18
  );

  createBuilding(
    x,
    55,
    18,
    15+Math.random()*25,
    18
  );
}


/* =========================
   TREES
========================= */

function createTree(x,z){

  const tree = new THREE.Group();


  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(
      .5,
      .7,
      4,
      8
    ),
    new THREE.MeshStandardMaterial({
      color:0x5b371c
    })
  );

  trunk.position.y=2;

  tree.add(trunk);


  const leaves = new THREE.Mesh(
    new THREE.SphereGeometry(
      3,
      10,
      10
    ),
    new THREE.MeshStandardMaterial({
      color:0x176b2b
    })
  );

  leaves.position.y=6;

  tree.add(leaves);

  tree.position.set(
    x,
    0,
    z
  );

  scene.add(tree);
}


for(
  let i=0;
  i<35;
  i++
){

  const side =
    Math.random()<.5
      ? -1
      : 1;

  createTree(
    side*(15+Math.random()*45),
    -100+Math.random()*200
  );
}


/* =========================
   PLAYER
========================= */

const player = new THREE.Group();


const body = new THREE.Mesh(
  new THREE.CapsuleGeometry(
    .65,
    1.4,
    4,
    8
  ),
  new THREE.MeshStandardMaterial({
    color:0x202020
  })
);

body.position.y=1.3;

body.castShadow=true;

player.add(body);


const head = new THREE.Mesh(
  new THREE.SphereGeometry(
    .48,
    16,
    16
  ),
  new THREE.MeshStandardMaterial({
    color:0x8d5524
  })
);

head.position.y=2.6;

head.castShadow=true;

player.add(head);


const hair = new THREE.Mesh(
  new THREE.SphereGeometry(
    .5,
    16,
    8,
    0,
    Math.PI*2,
    0,
    Math.PI*.45
  ),
  new THREE.MeshStandardMaterial({
    color:0x111111
  })
);

hair.position.y=2.82;

player.add(hair);


player.position.set(
  0,
  0,
  20
);

scene.add(player);


/* =========================
   RANGE ROVER
========================= */

const car = new THREE.Group();


const carBody = new THREE.Mesh(
  new THREE.BoxGeometry(
    4.2,
    1.3,
    7
  ),
  new THREE.MeshStandardMaterial({
    color:0x111111,
    metalness:.7,
    roughness:.25
  })
);

carBody.position.y=1.1;

carBody.castShadow=true;

car.add(carBody);


const roof = new THREE.Mesh(
  new THREE.BoxGeometry(
    3.8,
    1,
    4
  ),
  new THREE.MeshStandardMaterial({
    color:0x151515,
    metalness:.6
  })
);

roof.position.y=2.1;

car.add(roof);


const glass = new THREE.Mesh(
  new THREE.BoxGeometry(
    3.5,
    .7,
    3.8
  ),
  new THREE.MeshStandardMaterial({
    color:0x183b52,
    transparent:true,
    opacity:.75
  })
);

glass.position.y=2.05;

car.add(glass);


function wheel(x,z){

  const w = new THREE.Mesh(
    new THREE.CylinderGeometry(
      .65,
      .65,
      .5,
      16
    ),
    new THREE.MeshStandardMaterial({
      color:0x111111
    })
  );

  w.rotation.z=Math.PI/2;

  w.position.set(
    x,
    .65,
    z
  );

  car.add(w);
}


wheel(-2.1,-2.3);
wheel(2.1,-2.3);
wheel(-2.1,2.3);
wheel(2.1,2.3);


car.position.set(
  8,
  0,
  18
);

scene.add(car);


/* =========================
   CONTROLS
========================= */

let moveX=0;
let moveY=0;

let driving=false;

const joystick =
  document.getElementById("joystick");

const stick =
  document.getElementById("stick");


let joystickTouch=null;


joystick.addEventListener(
  "touchstart",
  e=>{

    e.preventDefault();

    joystickTouch =
      e.changedTouches[0].identifier;

  },
  {passive:false}
);


joystick.addEventListener(
  "touchmove",
  e=>{

    e.preventDefault();

    let touch;

    for(
      const t of e.changedTouches
    ){

      if(
        t.identifier===
        joystickTouch
      ){

        touch=t;
        break;
      }
    }

    if(!touch)return;

    const rect =
      joystick.getBoundingClientRect();

    let dx =
      touch.clientX -
      (rect.left+rect.width/2);

    let dy =
      touch.clientY -
      (rect.top+rect.height/2);

    const max=42;

    const length =
      Math.sqrt(
        dx*dx+dy*dy
      );

    if(length>max){

      dx=dx/length*max;
      dy=dy/length*max;

    }

    stick.style.transform =
      `translate(${dx}px,${dy}px)`;

    moveX=dx/max;
    moveY=dy/max;

  },
  {passive:false}
);


joystick.addEventListener(
  "touchend",
  e=>{

    for(
      const t of e.changedTouches
    ){

      if(
        t.identifier===
        joystickTouch
      ){

        moveX=0;
        moveY=0;

        stick.style.transform=
          "translate(0,0)";

        joystickTouch=null;
      }
    }

  },
  {passive:false}
);


/* =========================
   CAMERA ORBIT
========================= */

let cameraYaw=0;

let cameraPitch=.45;

let cameraTouch=null;

let lastX=0;

let lastY=0;


renderer.domElement.addEventListener(
  "touchstart",
  e=>{

    if(e.touches.length!==1)return;

    cameraTouch =
      e.touches[0].identifier;

    lastX =
      e.touches[0].clientX;

    lastY =
      e.touches[0].clientY;

  },
  {passive:false}
);


renderer.domElement.addEventListener(
  "touchmove",
  e=>{

    if(cameraTouch===null)return;

    let touch=null;

    for(
      const t of e.changedTouches
    ){

      if(
        t.identifier===
        cameraTouch
      ){

        touch=t;
        break;
      }
    }

    if(!touch)return;

    e.preventDefault();

    const dx =
      touch.clientX-lastX;

    const dy =
      touch.clientY-lastY;

    lastX=touch.clientX;
    lastY=touch.clientY;


    cameraYaw -= dx*.006;

    cameraPitch -= dy*.004;


    cameraPitch =
      Math.max(
        .15,
        Math.min(
          1.15,
          cameraPitch
        )
      );

  },
  {passive:false}
);


renderer.domElement.addEventListener(
  "touchend",
  e=>{

    for(
      const t of e.changedTouches
    ){

      if(
        t.identifier===
        cameraTouch
      ){

        cameraTouch=null;
      }
    }

  },
  {passive:false}
);


/* =========================
   ACTION
========================= */

document
  .getElementById("action")
  .addEventListener(
    "click",
    ()=>{

      const target =
        driving
          ? car
          : player;

      if(
        player.position.distanceTo(
          car.position
        )<8 ||
        driving
      ){

        driving=!driving;

        if(driving){

          player.visible=false;

          document.getElementById(
            "status"
          ).textContent=
            "Driving • Drag screen to look around";

        }else{

          player.visible=true;

          player.position.copy(
            car.position
          );

          player.position.x+=4;

          document.getElementById(
            "status"
          ).textContent=
            "Drag the screen to look around";
        }

      }

    }
  );


/* =========================
   MOVEMENT
========================= */

const direction =
  new THREE.Vector3();

const forward =
  new THREE.Vector3();

const right =
  new THREE.Vector3();


function updateMovement(){

  if(
    Math.abs(moveX)<.01 &&
    Math.abs(moveY)<.01
  ){

    return;
  }


  /*
     Camera-relative movement
  */

  forward.set(
    -Math.sin(cameraYaw),
    0,
    -Math.cos(cameraYaw)
  );

  right.set(
    Math.cos(cameraYaw),
    0,
    -Math.sin(cameraYaw)
  );


  direction
    .set(0,0,0)
    .addScaledVector(
      right,
      moveX
    )
    .addScaledVector(
      forward,
      -moveY
    );


  if(
    direction.length()>0
  ){

    direction.normalize();

    const speed =
      driving ? .42 : .16;

    const target =
      driving
        ? car
        : player;

    target.position.addScaledVector(
      direction,
      speed
    );


    /*
       Turn player/car toward movement
    */

    target.rotation.y =
      Math.atan2(
        direction.x,
        direction.z
      );

  }

}


/* =========================
   CAMERA
========================= */

const desiredCamera =
  new THREE.Vector3();

const cameraTarget =
  new THREE.Vector3();


function updateCamera(){

  const target =
    driving
      ? car
      : player;


  cameraTarget.set(
    target.position.x,
    target.position.y+1.5,
    target.position.z
  );


  const distance=12;


  const horizontal =
    Math.cos(cameraPitch)*
    distance;


  desiredCamera.set(

    target.position.x +
      Math.sin(cameraYaw)*
      horizontal,

    target.position.y +
      2 +
      Math.sin(cameraPitch)*
      distance,

    target.position.z +
      Math.cos(cameraYaw)*
      horizontal

  );


  camera.position.lerp(
    desiredCamera,
    .12
  );


  camera.lookAt(
    cameraTarget
  );

}


/* =========================
   RESIZE
========================= */

addEventListener(
  "resize",
  ()=>{

    camera.aspect =
      innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );

  }
);


/* =========================
   GAME LOOP
========================= */

function animate(){

  requestAnimationFrame(
    animate
  );

  updateMovement();

  updateCamera();

  renderer.render(
    scene,
    camera
  );

}

animate();

</script>

</body>
</html>
