<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AbujaLifestyle</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  width: 100%;
  height: 100%;
  background: #87ceeb;
  font-family: Arial, sans-serif;
}

#game {
  width: 100%;
  height: 100%;
  display: block;
}

#title {
  position: fixed;
  top: 15px;
  left: 50%;
  transform: translateX(-50%);
  color: white;
  font-size: 24px;
  font-weight: bold;
  text-shadow: 2px 2px 5px black;
  z-index: 10;
}

#controls {
  position: fixed;
  bottom: 25px;
  left: 25px;
  z-index: 10;
}

button {
  width: 60px;
  height: 60px;
  margin: 4px;
  border: none;
  border-radius: 50%;
  background: rgba(0,0,0,0.55);
  color: white;
  font-size: 22px;
}

#rightControls {
  position: fixed;
  bottom: 25px;
  right: 25px;
  z-index: 10;
}

#info {
  position: fixed;
  top: 55px;
  left: 50%;
  transform: translateX(-50%);
  color: white;
  text-shadow: 1px 1px 4px black;
  z-index: 10;
}
</style>
</head>

<body>

<div id="title">AbujaLifestyle</div>
<div id="info">Abuja • Open World</div>

<div id="controls">
  <button id="forward">▲</button><br>
  <button id="left">◀</button>
  <button id="back">▼</button>
  <button id="right">▶</button>
</div>

<div id="rightControls">
  <button id="jump">⬆</button>
</div>

<canvas id="game"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x87ceeb);

const camera = new THREE.PerspectiveCamera(
  70,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

camera.position.set(0, 6, 10);

const renderer = new THREE.WebGLRenderer({
  canvas: document.getElementById("game"),
  antialias: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

/* LIGHT */

const sunlight = new THREE.DirectionalLight(0xffffff, 2);
sunlight.position.set(50, 100, 50);
scene.add(sunlight);

const ambient = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambient);

/* GROUND */

const groundGeometry = new THREE.PlaneGeometry(500, 500);
const groundMaterial = new THREE.MeshStandardMaterial({
  color: 0x3f7d3a
});

const ground = new THREE.Mesh(
  groundGeometry,
  groundMaterial
);

ground.rotation.x = -Math.PI / 2;
scene.add(ground);

/* ROADS */

function createRoad(x, z, width, depth) {

  const geometry = new THREE.BoxGeometry(
    width,
    0.05,
    depth
  );

  const material = new THREE.MeshStandardMaterial({
    color: 0x333333
  });

  const road = new THREE.Mesh(
    geometry,
    material
  );

  road.position.set(x, 0.03, z);

  scene.add(road);
}

createRoad(0, 0, 500, 18);
createRoad(0, 0, 18, 500);

/* BUILDINGS */

function createBuilding(x, z, width, height, depth) {

  const geometry = new THREE.BoxGeometry(
    width,
    height,
    depth
  );

  const material = new THREE.MeshStandardMaterial({
    color: 0xd0d0d0
  });

  const building = new THREE.Mesh(
    geometry,
    material
  );

  building.position.set(
    x,
    height / 2,
    z
  );

  scene.add(building);
}

for (let x = -100; x <= 100; x += 30) {

  createBuilding(
    x,
    -45,
    18,
    10 + Math.random() * 20,
    18
  );

  createBuilding(
    x,
    45,
    18,
    10 + Math.random() * 20,
    18
  );
}

for (let z = -90; z <= 90; z += 30) {

  createBuilding(
    -45,
    z,
    18,
    10 + Math.random() * 20,
    18
  );

  createBuilding(
    45,
    z,
    18,
    10 + Math.random() * 20,
    18
  );
}

/* PLAYER */

const player = new THREE.Group();

const body = new THREE.Mesh(
  new THREE.BoxGeometry(1, 1.8, 0.6),
  new THREE.MeshStandardMaterial({
    color: 0x222222
  })
);

body.position.y = 1;

const head = new THREE.Mesh(
  new THREE.SphereGeometry(0.4, 16, 16),
  new THREE.MeshStandardMaterial({
    color: 0x8d5524
  })
);

head.position.y = 2.2;

player.add(body);
player.add(head);

player.position.set(0, 0, 5);

scene.add(player);

/* MOVEMENT */

const keys = {};

window.addEventListener("keydown", e => {
  keys[e.key.toLowerCase()] = true;
});

window.addEventListener("keyup", e => {
  keys[e.key.toLowerCase()] = false;
});

function holdButton(id, key) {

  const button = document.getElementById(id);

  button.addEventListener("touchstart", e => {
    e.preventDefault();
    keys[key] = true;
  });

  button.addEventListener("touchend", e => {
    e.preventDefault();
    keys[key] = false;
  });
}

holdButton("forward", "w");
holdButton("back", "s");
holdButton("left", "a");
holdButton("right", "d");

/* GAME LOOP */

function animate() {

  requestAnimationFrame(animate);

  const speed = 0.15;

  if (keys["w"]) player.position.z -= speed;
  if (keys["s"]) player.position.z += speed;
  if (keys["a"]) player.position.x -= speed;
  if (keys["d"]) player.position.x += speed;

  camera.position.x = player.position.x;
  camera.position.z = player.position.z + 10;

  camera.lookAt(
    player.position.x,
    1,
    player.position.z
  );

  renderer.render(scene, camera);
}

animate();

/* RESIZE */

window.addEventListener("resize", () => {

  camera.aspect =
    window.innerWidth /
    window.innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

});

</script>

</body>
</html>
