<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>AbujaLifestyle</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-user-select: none;
  user-select: none;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #111;
  font-family: Arial, sans-serif;
  touch-action: none;
}

/* GAME SCREEN */
#game {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100dvh;
  overflow: hidden;
  background: #72b9e8;
}

/* WORLD */
#world {
  position: absolute;
  width: 2400px;
  height: 1600px;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  transition: none;
}

/* SKY */
.sky {
  position: absolute;
  inset: 0;
  background:
    linear-gradient(
      #64b5e5 0%,
      #a8d9f0 42%,
      #83c66b 42%,
      #4e9b45 100%
    );
}

/* ROAD */
.road {
  position: absolute;
  left: 0;
  top: 650px;
  width: 2400px;
  height: 360px;
  background: #30343a;
}

.road::before {
  content: "";
  position: absolute;
  top: 175px;
  left: 0;
  width: 2400px;
  height: 10px;
  background: #f5d547;
}

.road::after {
  content: "";
  position: absolute;
  top: 20px;
  left: 0;
  width: 2400px;
  height: 6px;
  background: #777;
}

/* SIDEWALKS */
.sidewalk {
  position: absolute;
  left: 0;
  width: 2400px;
  height: 55px;
  background: #aaa;
}

.sidewalk.top {
  top: 595px;
}

.sidewalk.bottom {
  top: 1010px;
}

/* BUILDINGS */
.building {
  position: absolute;
  background: #ddd;
  border: 5px solid #555;
  box-shadow: 12px 12px 0 rgba(0,0,0,.2);
}

.building::before {
  content: "";
  position: absolute;
  inset: 18px;
  background:
    repeating-linear-gradient(
      90deg,
      #8ed0ed 0 45px,
      #444 45px 55px
    ),
    repeating-linear-gradient(
      0deg,
      transparent 0 45px,
      #444 45px 55px
    );
  opacity: .9;
}

.b1 {
  left: 180px;
  top: 140px;
  width: 300px;
  height: 420px;
}

.b2 {
  left: 620px;
  top: 210px;
  width: 260px;
  height: 350px;
  background: #c99d70;
}

.b3 {
  left: 1030px;
  top: 120px;
  width: 340px;
  height: 440px;
  background: #e7e0c9;
}

.b4 {
  left: 1570px;
  top: 190px;
  width: 290px;
  height: 370px;
  background: #d39b91;
}

.b5 {
  left: 1990px;
  top: 110px;
  width: 270px;
  height: 450px;
  background: #d8d8d8;
}

/* TREES */
.tree {
  position: absolute;
  width: 110px;
  height: 150px;
}

.tree .trunk {
  position: absolute;
  bottom: 0;
  left: 45px;
  width: 22px;
  height: 75px;
  background: #71462b;
}

.tree .leaves {
  position: absolute;
  width: 100px;
  height: 100px;
  border-radius: 50%;
  background: #237a35;
  box-shadow:
    30px -15px 0 #2f9140,
    -25px -10px 0 #2b8539,
    5px -35px 0 #328f3c;
}

.t1 { left: 40px; top: 430px; }
.t2 { left: 900px; top: 450px; }
.t3 { left: 1430px; top: 420px; }
.t4 { left: 1900px; top: 430px; }

/* PLAYER */
#player {
  position: absolute;
  width: 60px;
  height: 110px;
  left: 1170px;
  top: 1080px;
  z-index: 20;
}

.head {
  position: absolute;
  left: 17px;
  top: 0;
  width: 27px;
  height: 30px;
  border-radius: 50%;
  background: #8b542f;
}

.hair {
  position: absolute;
  left: 15px;
  top: -3px;
  width: 31px;
  height: 16px;
  border-radius: 50% 50% 20% 20%;
  background: #171717;
}

.body {
  position: absolute;
  left: 12px;
  top: 29px;
  width: 37px;
  height: 43px;
  border-radius: 8px;
  background: #111;
}

.arm {
  position: absolute;
  top: 32px;
  width: 9px;
  height: 42px;
  border-radius: 8px;
  background: #8b542f;
}

.arm.left { left: 5px; transform: rotate(8deg); }
.arm.right { right: 5px; transform: rotate(-8deg); }

.leg {
  position: absolute;
  top: 68px;
  width: 13px;
  height: 38px;
  border-radius: 8px;
  background: #222;
}

.leg.left { left: 16px; }
.leg.right { right: 16px; }

.shoe {
  position: absolute;
  top: 100px;
  width: 20px;
  height: 10px;
  border-radius: 6px;
  background: #050505;
}

.shoe.left { left: 10px; }
.shoe.right { right: 10px; }

/* CAR */
#car {
  position: absolute;
  left: 1350px;
  top: 1030px;
  width: 210px;
  height: 100px;
  z-index: 18;
}

.car-body {
  position: absolute;
  left: 5px;
  bottom: 12px;
  width: 200px;
  height: 65px;
  border-radius: 25px 30px 18px 18px;
  background: linear-gradient(#171717, #050505);
  box-shadow: 0 12px 15px rgba(0,0,0,.45);
}

.car-roof {
  position: absolute;
  left: 42px;
  top: 5px;
  width: 125px;
  height: 50px;
  border-radius: 55px 55px 5px 5px;
  background: #111;
}

.window {
  position: absolute;
  top: 13px;
  width: 52px;
  height: 29px;
  background: #203947;
  border: 2px solid #555;
}

.window.front {
  left: 105px;
  transform: skew(15deg);
}

.window.back {
  left: 50px;
  transform: skew(-15deg);
}

.grille {
  position: absolute;
  right: -2px;
  top: 31px;
  width: 25px;
  height: 24px;
  border-radius: 4px;
  background: #555;
}

.light {
  position: absolute;
  top: 20px;
  width: 20px;
  height: 10px;
  border-radius: 8px;
  background: #fff;
  box-shadow: 0 0 12px #fff;
}

.light.front {
  right: 8px;
}

.light.back {
  left: 8px;
}

.wheel {
  position: absolute;
  bottom: 0;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: #080808;
  border: 7px solid #444;
}

.wheel.front { right: 25px; }
.wheel.back { left: 25px; }

/* HUD */
#hud {
  position: fixed;
  top: 15px;
  left: 15px;
  right: 15px;
  z-index: 100;
  display: flex;
  justify-content: space-between;
  pointer-events: none;
}

.hud-box {
  padding: 10px 14px;
  border-radius: 12px;
  color: white;
  background: rgba(0,0,0,.65);
  backdrop-filter: blur(8px);
  font-weight: bold;
  box-shadow: 0 4px 12px rgba(0,0,0,.25);
}

/* JOYSTICK */
#joystick {
  position: fixed;
  left: 25px;
  bottom: 30px;
  width: 125px;
  height: 125px;
  border-radius: 50%;
  background: rgba(255,255,255,.15);
  border: 2px solid rgba(255,255,255,.35);
  z-index: 100;
}

#stick {
  position: absolute;
  left: 32px;
  top: 32px;
  width: 61px;
  height: 61px;
  border-radius: 50%;
  background: rgba(255,255,255,.65);
  box-shadow: 0 5px 15px rgba(0,0,0,.3);
}

/* ACTION */
#action {
  position: fixed;
  right: 25px;
  bottom: 45px;
  width: 90px;
  height: 90px;
  border-radius: 50%;
  border: 3px solid rgba(255,255,255,.6);
  background: rgba(20,20,20,.75);
  color: white;
  font-size: 16px;
  font-weight: bold;
  z-index: 100;
  box-shadow: 0 7px 20px rgba(0,0,0,.35);
}

/* STATUS */
#status {
  position: fixed;
  left: 50%;
  bottom: 25px;
  transform: translateX(-50%);
  padding: 9px 16px;
  border-radius: 20px;
  background: rgba(0,0,0,.65);
  color: white;
  font-size: 13px;
  z-index: 100;
  pointer-events: none;
}

/* PHONE BUTTON */
#phone {
  position: fixed;
  right: 25px;
  top: 80px;
  width: 58px;
  height: 58px;
  border: 0;
  border-radius: 50%;
  background: rgba(0,0,0,.7);
  color: white;
  font-size: 25px;
  z-index: 100;
}
</style>
</head>

<body>

<div id="game">

  <div id="world">

    <div class="sky"></div>

    <div class="building b1"></div>
    <div class="building b2"></div>
    <div class="building b3"></div>
    <div class="building b4"></div>
    <div class="building b5"></div>

    <div class="tree t1">
      <div class="leaves"></div>
      <div class="trunk"></div>
    </div>

    <div class="tree t2">
      <div class="leaves"></div>
      <div class="trunk"></div>
    </div>

    <div class="tree t3">
      <div class="leaves"></div>
      <div class="trunk"></div>
    </div>

    <div class="tree t4">
      <div class="leaves"></div>
      <div class="trunk"></div>
    </div>

    <div class="sidewalk top"></div>
    <div class="road"></div>
    <div class="sidewalk bottom"></div>

    <div id="player">
      <div class="head"></div>
      <div class="hair"></div>
      <div class="body"></div>
      <div class="arm left"></div>
      <div class="arm right"></div>
      <div class="leg left"></div>
      <div class="leg right"></div>
      <div class="shoe left"></div>
      <div class="shoe right"></div>
    </div>

    <div id="car">
      <div class="car-body"></div>
      <div class="car-roof"></div>
      <div class="window front"></div>
      <div class="window back"></div>
      <div class="grille"></div>
      <div class="light front"></div>
      <div class="light back"></div>
      <div class="wheel front"></div>
      <div class="wheel back"></div>
    </div>

  </div>

  <div id="hud">
    <div class="hud-box">🇳🇬 ABUJA</div>
    <div class="hud-box">₦25,000</div>
  </div>

  <button id="phone">📱</button>

  <div id="joystick">
    <div id="stick"></div>
  </div>

  <button id="action">ACTION</button>

  <div id="status">Walk around Abuja</div>

</div>

<script>
const world = document.getElementById("world");
const player = document.getElementById("player");
const car = document.getElementById("car");
const joystick = document.getElementById("joystick");
const stick = document.getElementById("stick");
const action = document.getElementById("action");
const status = document.getElementById("status");

let playerX = 1170;
let playerY = 1080;

let carX = 1350;
let carY = 1030;

let moveX = 0;
let moveY = 0;

let driving = false;

let joystickActive = false;

function updatePlayer() {
  player.style.left = playerX + "px";
  player.style.top = playerY + "px";
}

function updateCar() {
  car.style.left = carX + "px";
  car.style.top = carY + "px";
}

function camera() {

  let targetX;
  let targetY;

  if (driving) {
    targetX = carX + 100;
    targetY = carY + 50;
  } else {
    targetX = playerX + 30;
    targetY = playerY + 55;
  }

  const screenX = window.innerWidth / 2;
  const screenY = window.innerHeight / 2;

  const x = screenX - targetX;
  const y = screenY - targetY;

  world.style.transform =
    "translate(" + x + "px, " + y + "px)";
}

function gameLoop() {

  if (driving) {

    carX += moveX * 0.55;
    carY += moveY * 0.48;

  } else {

    playerX += moveX * 0.16;
    playerY += moveY * 0.13;

  }

  playerX = Math.max(20, Math.min(2320, playerX));
  playerY = Math.max(20, Math.min(1480, playerY));

  carX = Math.max(20, Math.min(2190, carX));
  carY = Math.max(20, Math.min(1480, carY));

  updatePlayer();
  updateCar();
  camera();

  requestAnimationFrame(gameLoop);
}

function joystickMove(clientX, clientY) {

  const rect = joystick.getBoundingClientRect();

  const centerX = rect.left + rect.width / 2;
  const centerY = rect.top + rect.height / 2;

  let dx = clientX - centerX;
  let dy = clientY - centerY;

  const distance = Math.sqrt(dx * dx + dy * dy);

  const maxDistance = 45;

  if (distance > maxDistance) {
    dx = dx / distance * maxDistance;
    dy = dy / distance * maxDistance;
  }

  stick.style.transform =
    "translate(" + dx + "px," + dy + "px)";

  moveX = dx / maxDistance;
  moveY = dy / maxDistance;
}

function joystickEnd() {

  joystickActive = false;

  moveX = 0;
  moveY = 0;

  stick.style.transform = "translate(0,0)";
}

joystick.addEventListener("touchstart", function(e) {
  joystickActive = true;
  const t = e.touches[0];
  joystickMove(t.clientX, t.clientY);
}, {passive:false});

joystick.addEventListener("touchmove", function(e) {
  if (!joystickActive) return;

  e.preventDefault();

  const t = e.touches[0];
  joystickMove(t.clientX, t.clientY);
}, {passive:false});

joystick.addEventListener("touchend", joystickEnd);

action.addEventListener("touchstart", function(e) {

  e.preventDefault();

  const distance =
    Math.sqrt(
      Math.pow(playerX - carX, 2) +
      Math.pow(playerY - carY, 2)
    );

  if (!driving && distance < 180) {

    driving = true;

    status.textContent = "Driving Range Rover Velar";

  } else if (driving) {

    driving = false;

    playerX = carX - 80;
    playerY = carY + 20;

    status.textContent = "Walking around Abuja";

  } else {

    status.textContent = "Move closer to the Range Rover";

  }

}, {passive:false});

document.getElementById("phone").addEventListener("touchstart", function(e) {

  e.preventDefault();

  status.textContent = "Phone coming soon...";

});

updatePlayer();
updateCar();
gameLoop();
</script>

</body>
</html>
