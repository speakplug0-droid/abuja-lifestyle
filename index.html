<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>AbujaLifestyle</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#87b9e8;
  font-family:Arial,sans-serif;
  touch-action:none;
}

canvas{
  display:block;
  width:100%;
  height:100%;
}

#online{
  position:fixed;
  top:12px;
  left:12px;
  z-index:50;
  padding:8px 12px;
  border-radius:10px;
  background:rgba(0,0,0,.55);
  color:white;
  font-size:13px;
}

#title{
  position:fixed;
  top:12px;
  right:12px;
  z-index:50;
  color:white;
  font-weight:bold;
  font-size:16px;
  text-shadow:0 2px 5px #000;
}

#interaction{
  display:none;
  position:fixed;
  left:50%;
  bottom:185px;
  transform:translateX(-50%);
  z-index:60;
  padding:13px 20px;
  border:0;
  border-radius:12px;
  background:#e9b62f;
  color:#111;
  font-size:15px;
  font-weight:bold;
  box-shadow:0 4px 12px rgba(0,0,0,.35);
}

#controls{
  position:fixed;
  left:20px;
  bottom:25px;
  z-index:50;
  width:190px;
  height:150px;
}

.btn{
  position:absolute;
  width:58px;
  height:58px;
  border:1px solid rgba(255,255,255,.3);
  border-radius:16px;
  background:rgba(0,0,0,.5);
  color:white;
  font-size:25px;
  display:flex;
  align-items:center;
  justify-content:center;
  user-select:none;
  -webkit-user-select:none;
  backdrop-filter:blur(5px);
}

.btn:active{
  background:rgba(255,255,255,.3);
  transform:scale(.94);
}

#up{left:66px;top:0}
#down{left:66px;bottom:0}
#left{left:0;top:66px}
#right{right:0;top:66px}

#exit{
  display:none;
  position:fixed;
  right:20px;
  bottom:30px;
  z-index:60;
  padding:14px 18px;
  border:0;
  border-radius:12px;
  background:#c9342f;
  color:white;
  font-weight:bold;
  font-size:14px;
}

#hint{
  position:fixed;
  bottom:18px;
  right:18px;
  z-index:50;
  color:white;
  background:rgba(0,0,0,.4);
  padding:8px 11px;
  border-radius:8px;
  font-size:11px;
}

#insideLabel{
  display:none;
  position:fixed;
  top:55px;
  left:50%;
  transform:translateX(-50%);
  z-index:50;
  color:white;
  background:rgba(0,0,0,.55);
  padding:8px 14px;
  border-radius:10px;
  font-weight:bold;
}
</style>
</head>

<body>

<div id="online">Connecting...</div>
<div id="title">ABUJA LIFESTYLE</div>

<div id="insideLabel">MY HOUSE</div>

<button id="interaction">
ENTER HOUSE
</button>

<div id="controls">
  <div class="btn" id="up">▲</div>
  <div class="btn" id="down">▼</div>
  <div class="btn" id="left">◀</div>
  <div class="btn" id="right">▶</div>
</div>

<button id="exit">EXIT HOUSE</button>

<div id="hint">Swipe to look around</div>

<canvas id="game"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="./car.js"></script>

<script>

const canvas=document.getElementById("game");

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x8fc5ed);

scene.fog=new THREE.Fog(
  0x8fc5ed,
  180,
  520
);

const camera=new THREE.PerspectiveCamera(
  65,
  innerWidth/innerHeight,
  .1,
  1000
);

const renderer=new THREE.WebGLRenderer({
  canvas,
  antialias:true,
  powerPreference:"high-performance"
});

renderer.setSize(
  innerWidth,
  innerHeight
);

renderer.setPixelRatio(
  Math.min(devicePixelRatio,1.5)
);

renderer.shadowMap.enabled=true;
renderer.shadowMap.type=
  THREE.PCFSoftShadowMap;

renderer.outputColorSpace=
  THREE.SRGBColorSpace;


/* =========================
   LIGHTS
========================= */

const sun=new THREE.DirectionalLight(
  0xffffff,
  2.2
);

sun.position.set(
  120,
  180,
  80
);

sun.castShadow=true;

sun.shadow.mapSize.width=1024;
sun.shadow.mapSize.height=1024;

scene.add(sun);

scene.add(
  new THREE.HemisphereLight(
    0xbfe3ff,
    0x44552f,
    1.3
  )
);


/* =========================
   MATERIALS
========================= */

function mat(color,rough=.8){
  return new THREE.MeshStandardMaterial({
    color,
    roughness:rough
  });
}

const roadMat=mat(0x292929);
const sidewalkMat=mat(0xb7b7b7);
const whiteMat=mat(0xf3f3f3);
const yellowMat=mat(0xf0c52f);


/* =========================
   WORLD GROUND
========================= */

const grass=new THREE.Mesh(
  new THREE.PlaneGeometry(500,500),
  mat(0x4c8b43)
);

grass.rotation.x=-Math.PI/2;
grass.receiveShadow=true;

scene.add(grass);


/* =========================
   ROADS
========================= */

function road(x,z,w,d){

  const r=new THREE.Mesh(
    new THREE.BoxGeometry(w,.08,d),
    roadMat
  );

  r.position.set(x,.04,z);
  r.receiveShadow=true;

  scene.add(r);
}

road(0,0,28,500);
road(0,0,500,28);

road(-115,0,16,500);
road(115,0,16,500);

road(0,-115,500,16);
road(0,115,500,16);


/* =========================
   ROAD MARKINGS
========================= */

function line(x,z,w,d,material){

  const m=new THREE.Mesh(
    new THREE.BoxGeometry(w,.025,d),
    material
  );

  m.position.set(x,.11,z);

  scene.add(m);
}

for(let x=-235;x<235;x+=24){
  line(x,0,11,.45,whiteMat);
}

for(let z=-235;z<235;z+=24){
  line(0,z,.45,11,whiteMat);
}

line(0,-12,500,.35,yellowMat);
line(0,12,500,.35,yellowMat);
line(-12,0,.35,500,yellowMat);
line(12,0,.35,500,yellowMat);


/* =========================
   SIDEWALKS
========================= */

function sidewalk(x,z,w,d){

  const s=new THREE.Mesh(
    new THREE.BoxGeometry(w,.18,d),
    sidewalkMat
  );

  s.position.set(x,.09,z);
  s.receiveShadow=true;

  scene.add(s);
}

sidewalk(0,-18,500,4);
sidewalk(0,18,500,4);
sidewalk(-18,0,4,500);
sidewalk(18,0,4,500);


/* =========================
   BUILDINGS
========================= */

const buildingColors=[
  0xd8c5a8,
  0xc6c6c6,
  0xe1d3ba,
  0xb8c1c8,
  0xd1b08a,
  0xaeb9aa
];

function building(
  x,z,w,d,h
){

  const b=new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    mat(
      buildingColors[
        Math.floor(
          Math.random()*
          buildingColors.length
        )
      ]
    )
  );

  b.position.set(
    x,
    h/2,
    z
  );

  b.castShadow=true;
  b.receiveShadow=true;

  scene.add(b);

  const roof=new THREE.Mesh(
    new THREE.BoxGeometry(
      w+.5,
      .35,
      d+.5
    ),
    mat(0x555555)
  );

  roof.position.set(
    x,
    h+.18,
    z
  );

  scene.add(roof);

  const glass=mat(0x263b4a);

  const rows=Math.max(
    1,
    Math.floor(h/4)
  );

  const cols=Math.max(
    1,
    Math.floor(w/3)
  );

  for(let r=0;r<rows;r++){

    for(let c=0;c<cols;c++){

      const wx=
        x-w/2+1.5+c*3;

      const wy=
        2.2+r*3.2;

      const window=new THREE.Mesh(
        new THREE.BoxGeometry(
          1.2,
          1.5,
          .08
        ),
        glass
      );

      window.position.set(
        wx,
        wy,
        z-d/2-.05
      );

      scene.add(window);

      const back=window.clone();

      back.position.z=
        z+d/2+.05;

      scene.add(back);
    }
  }
}


const blocks=[
  [-70,-70],
  [70,-70],
  [-70,70],
  [70,70],
  [-180,-70],
  [180,-70],
  [-180,70],
  [180,70],
  [-70,-180],
  [70,-180],
  [-70,180],
  [70,180],
  [-180,-180],
  [180,-180],
  [-180,180],
  [180,180]
];

blocks.forEach(([x,z])=>{

  const count=
    2+Math.floor(Math.random()*3);

  for(let i=0;i<count;i++){

    building(
      x+(Math.random()-.5)*35,
      z+(Math.random()-.5)*35,
      10+Math.random()*12,
      10+Math.random()*12,
      8+Math.random()*22
    );
  }
});


/* =========================
   TREES
========================= */

function tree(x,z){

  const trunk=new THREE.Mesh(
    new THREE.CylinderGeometry(
      .35,.5,3,8
    ),
    mat(0x70452b)
  );

  trunk.position.set(x,1.5,z);

  scene.add(trunk);

  const crown=new THREE.Mesh(
    new THREE.IcosahedronGeometry(
      2.4,1
    ),
    mat(0x267a35)
  );

  crown.position.set(x,4,z);

  scene.add(crown);
}

for(let i=-230;i<=230;i+=28){

  tree(-25,i);
  tree(25,i);
  tree(i,-25);
  tree(i,25);
}


/* =========================
   STREET LIGHTS
========================= */

function streetLight(x,z){

  const pole=new THREE.Mesh(
    new THREE.CylinderGeometry(
      .12,.18,7,8
    ),
    mat(0x333333)
  );

  pole.position.set(x,3.5,z);

  scene.add(pole);

  const arm=new THREE.Mesh(
    new THREE.BoxGeometry(
      2,.12,.12
    ),
    mat(0x333333)
  );

  arm.position.set(
    x,
    6.8,
    z
  );

  scene.add(arm);

  const lamp=new THREE.Mesh(
    new THREE.SphereGeometry(
      .28,8,8
    ),
    mat(0xffffcc)
  );

  lamp.position.set(
    x+1,
    6.7,
    z
  );

  scene.add(lamp);
}

for(let i=-210;i<=210;i+=42){

  streetLight(-22,i);
  streetLight(22,i);
}


/* =====================================================
   FIRST ENTERABLE HOUSE
===================================================== */

const house={
  x:55,
  z:35,
  doorX:55,
  doorZ:29
};


/* driveway */

const driveway=new THREE.Mesh(
  new THREE.BoxGeometry(
    8,.12,14
  ),
  mat(0x777777)
);

driveway.position.set(
  house.x,
  .06,
  house.z-10
);

scene.add(driveway);


/* house body */

const houseBody=new THREE.Mesh(
  new THREE.BoxGeometry(
    18,
    7,
    14
  ),
  mat(0xd8c09c)
);

houseBody.position.set(
  house.x,
  3.5,
  house.z
);

houseBody.castShadow=true;
houseBody.receiveShadow=true;

scene.add(houseBody);


/* roof */

const roof=new THREE.Mesh(
  new THREE.ConeGeometry(
    13,
    5,
    4
  ),
  mat(0x873a2e)
);

roof.position.set(
  house.x,
  9,
  house.z
);

roof.rotation.y=Math.PI/4;

scene.add(roof);


/* front door */

const door=new THREE.Mesh(
  new THREE.BoxGeometry(
    2.5,
    4,
    .25
  ),
  mat(0x563a25)
);

door.position.set(
  house.doorX,
  2,
  house.doorZ-7.1
);

scene.add(door);


/* door frame */

const frameMat=mat(0xffffff);

const frameTop=new THREE.Mesh(
  new THREE.BoxGeometry(
    3.1,.25,.3
  ),
  frameMat
);

frameTop.position.set(
  house.doorX,
  4.15,
  house.doorZ-7.25
);

scene.add(frameTop);


/* front windows */

function houseWindow(x,z){

  const w=new THREE.Mesh(
    new THREE.BoxGeometry(
      3.2,
      2.3,
      .15
    ),
    mat(0x29475a,.25)
  );

  w.position.set(
    x,
    3.4,
    z
  );

  scene.add(w);
}

houseWindow(48,27.9);
houseWindow(62,27.9);


/* compound walls */

const wallMat=mat(0xb8a995);

const wallA=new THREE.Mesh(
  new THREE.BoxGeometry(
    26,2,.4
  ),
  wallMat
);

wallA.position.set(
  house.x,
  1,
  house.z+10
);

scene.add(wallA);


const wallB=wallA.clone();

wallB.position.z=
  house.z-14;

scene.add(wallB);


const wallC=new THREE.Mesh(
  new THREE.BoxGeometry(
    .4,2,24
  ),
  wallMat
);

wallC.position.set(
  house.x+13,
  1,
  house.z-2
);

scene.add(wallC);


const wallD=wallC.clone();

wallD.position.x=
  house.x-13;

scene.add(wallD);


/* gate posts */

function gatePost(x){

  const p=new THREE.Mesh(
    new THREE.BoxGeometry(
      .6,2.7,.6
    ),
    mat(0x777777)
  );

  p.position.set(
    x,
    1.35,
    house.z-14
  );

  scene.add(p);
}

gatePost(house.x-4);
gatePost(house.x+4);


/* house sign */

const sign=new THREE.Mesh(
  new THREE.BoxGeometry(
    5,.9,.15
  ),
  mat(0x253c2c)
);

sign.position.set(
  house.x,
  6.3,
  house.z-7.2
);

scene.add(sign);


/* =========================
   HOUSE INTERIOR
========================= */

const interior=
  new THREE.Group();

scene.add(interior);

const interiorFloor=new THREE.Mesh(
  new THREE.BoxGeometry(
    18,.2,14
