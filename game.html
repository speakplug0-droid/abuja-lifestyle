<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>AbujaLifestyle</title>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  touch-action:none;
  font-family:Arial,sans-serif;
}

#game{
  position:fixed;
  inset:0;
  width:100vw;
  height:100dvh;
  overflow:hidden;
  background:#000;
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

#hud{
  position:absolute;
  top:12px;
  left:12px;
  right:12px;
  display:flex;
  justify-content:space-between;
  z-index:5;
  pointer-events:none;
}

.box{
  background:rgba(0,0,0,.65);
  color:white;
  padding:10px 14px;
  border-radius:12px;
  font-weight:bold;
  backdrop-filter:blur(8px);
}

#phone{
  position:absolute;
  top:70px;
  right:18px;
  width:58px;
  height:58px;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.72);
  color:white;
  font-size:25px;
  z-index:6;
}

#joystick{
  position:absolute;
  left:22px;
  bottom:25px;
  width:125px;
  height:125px;
  border-radius:50%;
  background:rgba(255,255,255,.16);
  border:2px solid rgba(255,255,255,.35);
  z-index:6;
}

#stick{
  position:absolute;
  width:58px;
  height:58px;
  left:31px;
  top:31px;
  border-radius:50%;
  background:rgba(255,255,255,.7);
}

#action{
  position:absolute;
  right:24px;
  bottom:38px;
  width:90px;
  height:90px;
  border-radius:50%;
  border:3px solid rgba(255,255,255,.55);
  background:rgba(0,0,0,.72);
  color:white;
  font-weight:bold;
  z-index:6;
}

#status{
  position:absolute;
  left:50%;
  bottom:20px;
  transform:translateX(-50%);
  background:rgba(0,0,0,.65);
  color:white;
  padding:9px 16px;
  border-radius:20px;
  font-size:13px;
  z-index:6;
  pointer-events:none;
}
</style>
</head>

<body>

<div id="game">

<canvas id="canvas"></canvas>

<div id="hud">
  <div class="box">🇳🇬 ABUJA</div>
  <div class="box">₦25,000</div>
</div>

<button id="phone">📱</button>

<div id="joystick">
  <div id="stick"></div>
</div>

<button id="action">ACTION</button>

<div id="status">Welcome to Abuja</div>

</div>

<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;

function resize(){
  W=innerWidth;
  H=innerHeight;
  canvas.width=W*devicePixelRatio;
  canvas.height=H*devicePixelRatio;
  canvas.style.width=W+"px";
  canvas.style.height=H+"px";
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}

addEventListener("resize",resize);
resize();

/* WORLD */

const world={
  width:5000,
  height:5000
};

let player={
  x:2500,
  y:3100,
  angle:0
};

let car={
  x:2800,
  y:3000,
  angle:0
};

let driving=false;

let joyX=0;
let joyY=0;
let joyActive=false;

/* BUILDINGS */

const buildings=[];

for(let x=500;x<4700;x+=550){

  buildings.push({
    x:x,
    y:650,
    w:300,
    h:360,
    color:"#c8b08b"
  });

  buildings.push({
    x:x+120,
    y:3950,
    w:300,
    h:360,
    color:"#d3c2a5"
  });
}

/* TREES */

const trees=[];

for(let i=0;i<35;i++){

  trees.push({
    x:300+Math.random()*4400,
    y:250+Math.random()*4500
  });
}

/* DRAW WORLD */

function drawWorld(){

  ctx.fillStyle="#7fc5ec";
  ctx.fillRect(0,0,W,H);

  const cameraX=driving?car.x:player.x;
  const cameraY=driving?car.y:player.y;

  ctx.save();

  ctx.translate(
    W/2-cameraX,
    H/2-cameraY
  );

  /* grass */

  ctx.fillStyle="#4f9c48";
  ctx.fillRect(0,0,world.width,world.height);

  /* main road */

  ctx.fillStyle="#30343a";
  ctx.fillRect(0,2100,world.width,800);

  /* road markings */

  ctx.strokeStyle="#f4d343";
  ctx.lineWidth=10;
  ctx.setLineDash([70,70]);

  ctx.beginPath();
  ctx.moveTo(0,2500);
  ctx.lineTo(world.width,2500);
  ctx.stroke();

  ctx.setLineDash([]);

  /* side roads */

  ctx.fillStyle="#363a3f";

  for(let x=350;x<world.width;x+=700){
    ctx.fillRect(x,0,260,world.height);
  }

  /* buildings */

  for(const b of buildings){

    ctx.fillStyle="rgba(0,0,0,.25)";
    ctx.fillRect(b.x+15,b.y+15,b.w,b.h);

    ctx.fillStyle=b.color;
    ctx.fillRect(b.x,b.y,b.w,b.h);

    ctx.fillStyle="#72b9d7";

    for(let wx=b.x+25;wx<b.x+b.w-20;wx+=55){
      for(let wy=b.y+25;wy<b.y+b.h-20;wy+=65){
        ctx.fillRect(wx,wy,30,40);
      }
    }
  }

  /* trees */

  for(const t of trees){

    ctx.fillStyle="#70452b";
    ctx.fillRect(t.x-10,t.y,20,65);

    ctx.fillStyle="#257838";
    ctx.beginPath();
    ctx.arc(t.x,t.y,45,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="#318c3e";
    ctx.beginPath();
    ctx.arc(t.x+28,t.y-12,35,0,Math.PI*2);
    ctx.fill();
  }

  /* car */

  drawCar(car.x,car.y);

  /* player */

  if(!driving){
    drawPlayer(player.x,player.y);
  }

  ctx.restore();
}

/* PLAYER */

function drawPlayer(x,y){

  ctx.save();
  ctx.translate(x,y);

  /* shadow */

  ctx.fillStyle="rgba(0,0,0,.35)";
  ctx.beginPath();
  ctx.ellipse(0,32,28,10,0,0,Math.PI*2);
  ctx.fill();

  /* legs */

  ctx.fillStyle="#171717";
  ctx.fillRect(-17,8,12,34);
  ctx.fillRect(5,8,12,34);

  /* shoes */

  ctx.fillStyle="#050505";
  ctx.fillRect(-21,38,18,8);
  ctx.fillRect(4,38,18,8);

  /* body */

  ctx.fillStyle="#151515";
  ctx.fillRect(-21,-35,42,45);

  /* arms */

  ctx.strokeStyle="#8b542f";
  ctx.lineWidth=10;
  ctx.lineCap="round";

  ctx.beginPath();
  ctx.moveTo(-21,-28);
  ctx.lineTo(-30,4);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(21,-28);
  ctx.lineTo(30,4);
  ctx.stroke();

  /* neck */

  ctx.fillStyle="#8b542f";
  ctx.fillRect(-8,-44,16,12);

  /* head */

  ctx.beginPath();
  ctx.arc(0,-58,22,0,Math.PI*2);
  ctx.fill();

  /* hair */

  ctx.fillStyle="#111";
  ctx.beginPath();
  ctx.arc(0,-65,23,Math.PI,Math.PI*2);
  ctx.fill();

  ctx.restore();
}

/* RANGE ROVER STYLE SUV */

function drawCar(x,y){

  ctx.save();
  ctx.translate(x,y);

  ctx.fillStyle="rgba(0,0,0,.35)";
  ctx.beginPath();
  ctx.ellipse(0,45,115,30,0,0,Math.PI*2);
  ctx.fill();

  /* wheels */

  ctx.fillStyle="#080808";

  ctx.beginPath();
  ctx.arc(-70,38,25,0,Math.PI*2);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(70,38,25,0,Math.PI*2);
  ctx.fill();

  /* main body */

  ctx.fillStyle="#111";
  ctx.beginPath();
  ctx.roundRect(-105,-35,210,85,22);
  ctx.fill();

  /* roof */

  ctx.fillStyle="#171717";
  ctx.beginPath();
  ctx.roundRect(-65,-75,130,55,28);
  ctx.fill();

  /* windows */

  ctx.fillStyle="#29404c";

  ctx.beginPath();
  ctx.moveTo(-55,-65);
  ctx.lineTo(-8,-65);
  ctx.lineTo(-8,-25);
  ctx.lineTo(-65,-25);
  ctx.closePath();
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(5,-65);
  ctx.lineTo(52,-58);
  ctx.lineTo(65,-25);
  ctx.lineTo(5,-25);
  ctx.closePath();
  ctx.fill();

  /* headlights */

  ctx.fillStyle="#fff";
  ctx.fillRect(83,-10,17,14);
  ctx.fillRect(-100,-10,17,14);

  /* grille */

  ctx.fillStyle="#555";
  ctx.fillRect(95,10,10,28);

  ctx.restore();
}

/* CONTROLS */

function joystickMove(x,y){

  const r=joystick.getBoundingClientRect();

  const cx=r.left+r.width/2;
  const cy=r.top+r.height/2;

  let dx=x-cx;
  let dy=y-cy;

  const max=45;

  const distance=Math.sqrt(dx*dx+dy*dy);

  if(distance>max){
    dx=dx/distance*max;
    dy=dy/distance*max;
  }

  stick.style.transform=
    `translate(${dx}px,${dy}px)`;

  joyX=dx/max;
  joyY=dy/max;
}

function joystickEnd(){

  joyX=0;
  joyY=0;

  stick.style.transform="translate(0,0)";
}

joystick.addEventListener("touchstart",e=>{

  e.preventDefault();

  joyActive=true;

  const t=e.touches[0];

  joystickMove(t.clientX,t.clientY);

},{passive:false});

joystick.addEventListener("touchmove",e=>{

  e.preventDefault();

  if(!joyActive)return;

  const t=e.touches[0];

  joystickMove(t.clientX,t.clientY);

},{passive:false});

joystick.addEventListener("touchend",e=>{

  e.preventDefault();

  joyActive=false;

  joystickEnd();

},{passive:false});

/* ACTION */

document.getElementById("action").addEventListener("touchstart",e=>{

  e.preventDefault();

  const dx=player.x-car.x;
  const dy=player.y-car.y;

  const distance=Math.sqrt(dx*dx+dy*dy);

  if(!driving && distance<180){

    driving=true;

    document.getElementById("status").textContent=
      "Driving Range Rover";

  }else if(driving){

    driving=false;

    player.x=car.x-130;
    player.y=car.y;

    document.getElementById("status").textContent=
      "Walking around Abuja";

  }else{

    document.getElementById("status").textContent=
      "Move closer to the Range Rover";

  }

},{passive:false});

/* PHONE */

document.getElementById("phone").addEventListener("touchstart",e=>{

  e.preventDefault();

  document.getElementById("status").textContent=
    "Phone coming soon";

},{passive:false});

/* GAME LOOP */

function update(){

  if(driving){

    car.x+=joyX*12;
    car.y+=joyY*12;

    car.angle=Math.atan2(joyY,joyX);

  }else{

    player.x+=joyX*4;
    player.y+=joyY*4;

    if(Math.abs(joyX)+Math.abs(joyY)>0){
      player.angle=Math.atan2(joyY,joyX);
    }
  }

  player.x=Math.max(80,Math.min(world.width-80,player.x));
  player.y=Math.max(80,Math.min(world.height-80,player.y));

  car.x=Math.max(80,Math.min(world.width-80,car.x));
  car.y=Math.max(80,Math.min(world.height-80,car.y));

  drawWorld();

  requestAnimationFrame(update);
}

update();
</script>

</body>
</html>
