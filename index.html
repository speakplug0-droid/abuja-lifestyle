const keys={

  s:false,
  a:false,
  d:false
};

function bindButton(id,key){

  const button=
    document.getElementById(id);

  button.addEventListener(
    "touchstart",
    function(e){
      e.preventDefault();
      keys[key]=true;
    },
    {passive:false}
  );

  button.addEventListener(
    "touchend",
    function(e){
      e.preventDefault();
      keys[key]=false;
    },
    {passive:false}
  );

  button.addEventListener(
    "touchcancel",
    function(){
      keys[key]=false;
    }
  );

  button.addEventListener(
    "mousedown",
    function(){
      keys[key]=true;
    }
  );

  button.addEventListener(
    "mouseup",
    function(){
      keys[key]=false;
    }
  );

  button.addEventListener(
    "mouseleave",
    function(){
      keys[key]=false;
    }
  );
}

/* =====================================================
   CAMERA LOOK
===================================================== */

let orbit=0;
let pitch=.45;

let touching=false;
let lastX=0;
let lastY=0;

canvas.addEventListener(
  "touchstart",
  function(e){

    if(e.touches.length!==1)
      return;

    touching=true;

    lastX=e.touches[0].clientX;
    lastY=e.touches[0].clientY;
  },
  {passive:true}
);

canvas.addEventListener(
  "touchmove",
  function(e){

    if(!touching)
      return;

    if(e.touches.length!==1)
      return;

    const x=e.touches[0].clientX;
    const y=e.touches[0].clientY;

    orbit-=(x-lastX)*.006;

    pitch-=(y-lastY)*.004;

    pitch=Math.max(
      .15,
      Math.min(1.1,pitch)
    );

    lastX=x;
    lastY=y;
  },
  {passive:true}
);

canvas.addEventListener(
  "touchend",
  function(){
    touching=false;
  },
  {passive:true}
);

/* =====================================================
   MULTIPLAYER
===================================================== */

let socket=null;
let myId=null;

const otherPlayers={};

function connect(){

  try{

    const protocol=
      location.protocol==="https:"
      ?"wss:"
      :"ws:";

    socket=new WebSocket(
      protocol+"//"+location.host
    );

    socket.onopen=function(){

      online.textContent="ONLINE";

      online.style.background=
        "rgba(0,120,40,.75)";
    };

    socket.onmessage=function(event){

      try{

        const data=
          JSON.parse(event.data);

        if(data.type==="welcome"){
          myId=data.id;
        }

        if(data.type==="players"){

          const active={};

          for(const id in data.players){

            if(id===myId)
              continue;

            active[id]=true;

            if(!otherPlayers[id]){

              const p=
                new THREE.Mesh(
                  new THREE.BoxGeometry(
                    2,1.4,4
                  ),
                  mat(0x2449a8)
                );

              p.position.y=.8;

              scene.add(p);

              otherPlayers[id]=p;
            }

            const p=
              otherPlayers[id];

            const d=
              data.players[id];

            p.position.set(
              d.x,
              d.y+.8,
              d.z
            );

            p.rotation.y=
              d.rotation;
          }

          for(const id in otherPlayers){

            if(!active[id]){

              scene.remove(
                otherPlayers[id]
              );

              delete otherPlayers[id];
            }
          }
        }

      }catch(err){
        console.log(err);
      }
    };

    socket.onclose=function(){

      online.textContent="OFFLINE";

      online.style.background=
        "rgba(120,70,0,.75)";
    };

    socket.onerror=function(){
      online.textContent="OFFLINE";
    };

  }catch(err){

    online.textContent="OFFLINE";
  }
}


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
  "resize",
  function(){

    camera.aspect=
      innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );
  }
);


/* =====================================================
   GAME LOOP
===================================================== */

function animate(){

  requestAnimationFrame(animate);


  /* CAR */

  if(!inside){
    car.update(keys);
  }


  /* PLAYER */

  if(inside){

    let dx=0;
    let dz=0;

    if(keys.w)
      dz-=playerSpeed;

    if(keys.s)
      dz+=playerSpeed;

    if(keys.a)
      dx-=playerSpeed;

    if(keys.d)
      dx+=playerSpeed;

    if(dx!==0 || dz!==0){

      const length=
        Math.sqrt(dx*dx+dz*dz);

      dx/=length;
      dz/=length;

      player.position.x+=dx*playerSpeed;
      player.position.z+=dz*playerSpeed;

      player.rotation.y=
        Math.atan2(dx,dz);
    }


    /* Keep player inside house */

    player.position.x=
      Math.max(
        house.x-7.2,
        Math.min(
          house.x+7.2,
          player.position.x
        )
      );

    player.position.z=
      Math.max(
        house.z-5.2,
        Math.min(
          house.z+5.5,
          player.position.z
        )
      );
  }


  /* MULTIPLAYER */

  if(
    socket &&
    socket.readyState===
    WebSocket.OPEN
  ){

    socket.send(
      JSON.stringify({
        type:"position",
        x:inside
          ?player.position.x
          :car.group.position.x,

        y:inside
          ?player.position.y
          :car.group.position.y,

        z:inside
          ?player.position.z
          :car.group.position.z,

        rotation:inside
          ?player.rotation.y
          :car.group.rotation.y
      })
    );
  }


  /* ENTER BUTTON */

  if(!inside){

    if(distanceToDoor()<13){

      enterButton.style.display=
        "block";

    }else{

      enterButton.style.display=
        "none";
    }
  }


  /* CAMERA TARGET */

  const target=
    inside
      ?player.position.clone()
      :car.group.position.clone();

  target.y+=
    inside ? 1.5 : 1.8;


  /* CAMERA DISTANCE */

  const distance=
    inside ? 5.5 : 11;


  const horizontal=
    Math.cos(pitch)*distance;

  const vertical=
    Math.sin(pitch)*distance;


  const cx=
    target.x+
    Math.sin(orbit)*
    horizontal;

  const cz=
    target.z+
    Math.cos(orbit)*
    horizontal;


  camera.position.x+=
    (cx-camera.position.x)*.08;

  camera.position.y+=
    (target.y+vertical-camera.position.y)*.08;

  camera.position.z+=
    (cz-camera.position.z)*.08;


  camera.lookAt(target);


  renderer.render(
    scene,
    camera
  );
}


/* =====================================================
   START
===================================================== */

online.textContent="CONNECTING...";

connect();

animate();

}catch(error){

  const box=
    document.getElementById("online");

  box.textContent=
    "GAME ERROR: "+error.message;

  box.style.background="#c62828";
}

</script>
