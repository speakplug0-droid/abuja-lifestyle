/* RANGE ROVER — REAL 3D SUV */
const car = new THREE.Group();
car.position.set(8,0,18);
scene.add(car);
let carModel = null;
let carSpeed = 0;
let carSteer = 0;
const carLoader = new GLTFLoader();
carLoader.load(
  "https://cdn.3dassets.dev/assets/32519/v1/model.glb",
  (gltf)=>{
    carModel=gltf.scene;
    const box=new THREE.Box3().setFromObject(carModel);
    const size=box.getSize(new THREE.Vector3());
    if(size.z>0) carModel.scale.setScalar(5.0/size.z);
    const scaled=new THREE.Box3().setFromObject(carModel);
    const center=scaled.getCenter(new THREE.Vector3());
    carModel.position.x-=center.x;
    carModel.position.z-=center.z;
    const floor=new THREE.Box3().setFromObject(carModel);
    carModel.position.y-=floor.min.y;
    carModel.traverse(o=>{
      if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}
    });
    car.add(carModel);
    document.getElementById("status").textContent="Explore Abuja • SUV ready";
  },
  undefined,
  ()=>document.getElementById("status").textContent="Explore Abuja • SUV unavailable"
);

function updateCar(){
  if(!driving) return;

  const throttle=-moveY;
  const hasThrottle=Math.abs(throttle)>.045;

  // Smooth acceleration / braking.
  if(hasThrottle){
    const acceleration=throttle>=0 ? 0.032 : 0.045;
    carSpeed += throttle*acceleration;
  }else{
    carSpeed *= 0.955;
  }

  // Cap reverse and forward speed.
  carSpeed=Math.max(-0.50,Math.min(1.20,carSpeed));

  // Mobile steering: the joystick X axis controls a smooth steering angle.
  const steering=Math.max(-1,Math.min(1,moveX));
  carSteer += (steering-carSteer)*0.20;

  if(Math.abs(carSpeed)>0.006){
    const speedRatio=Math.min(Math.abs(carSpeed)/1.20,1);
    const steeringStrength=(0.018 + speedRatio*0.042);

    // Steering is strongest at speed and softer when reversing.
    car.rotation.y -=
      carSteer*steeringStrength*(carSpeed>=0 ? 1 : -0.72);

    // Move in the direction the SUV is facing.
    car.translateZ(carSpeed);
  }

  // Let the steering naturally return to centre.
  if(Math.abs(steering)<0.04){
    carSteer *= 0.88;
  }

  if(!hasThrottle && Math.abs(carSpeed)<0.018){
    carSpeed=0;
  }
}

/* CONTROLS */

let moveX=0;
let moveY=0;

let driving=false;


const joystick =
document.getElementById(
"joystick"
);

const stick =
document.getElementById(
"stick"
);

let joystickTouch=null;


joystick.addEventListener(
"touchstart",
e=>{

e.preventDefault();

joystickTouch =
e.changedTouches[0].identifier;

},
{passive:false}
);


joystick.addEventListener(
"touchmove",
e=>{

e.preventDefault();

let t;

for(
const touch of e.changedTouches
){

if(
touch.identifier===joystickTouch
){

t=touch;
break;

}

}

if(!t)return;


const rect =
joystick.getBoundingClientRect();


let dx =
t.clientX-
(rect.left+rect.width/2);

let dy =
t.clientY-
(rect.top+rect.height/2);


const max=42;

const len =
Math.sqrt(
dx*dx+dy*dy
);


if(len>max){

dx=dx/len*max;
dy=dy/len*max;

}


stick.style.transform=
`translate(${dx}px,${dy}px)`;


moveX=dx/max;
moveY=dy/max;

},
{passive:false}
);


joystick.addEventListener(
"touchend",
e=>{

for(
const t of e.changedTouches
){

if(
t.identifier===joystickTouch
){

moveX=0;
moveY=0;

stick.style.transform=
"translate(0,0)";

joystickTouch=null;

}

}

},
{passive:false}
);


/* CAMERA */

let cameraYaw=0;
let cameraPitch=.45;

let cameraTouch=null;

let lastX=0;
let lastY=0;


renderer.domElement.addEventListener(
"touchstart",
e=>{

if(e.touches.length!==1)return;

cameraTouch =
e.touches[0].identifier;

lastX =
e.touches[0].clientX;

lastY =
e.touches[0].clientY;

},
{passive:false}
);


renderer.domElement.addEventListener(
"touchmove",
e=>{

if(cameraTouch===null)return;

let t=null;

for(
const touch of e.changedTouches
){

if(
touch.identifier===cameraTouch
){

t=touch;
break;

}

}

if(!t)return;

e.preventDefault();


const dx =
t.clientX-lastX;

const dy =
t.clientY-lastY;


lastX=t.clientX;
lastY=t.clientY;


cameraYaw-=dx*.006;

cameraPitch-=dy*.004;


cameraPitch=
Math.max(
.15,
Math.min(
1.15,
cameraPitch
)
);

},
{passive:false}
);


renderer.domElement.addEventListener(
"touchend",
e=>{

for(
const t of e.changedTouches
){

if(
t.identifier===cameraTouch
){

cameraTouch=null;

}

}

},
{passive:false}
);

/* MOVEMENT */

const direction =
new THREE.Vector3();

const forward =
new THREE.Vector3();

const right =
new THREE.Vector3();


function updateMovement(){

if(!player || driving)return;

if(
Math.abs(moveX)<.01 &&
Math.abs(moveY)<.01
)return;

forward.set(
-Math.sin(cameraYaw),
0,
-Math.cos(cameraYaw)
);

right.set(
Math.cos(cameraYaw),
0,
-Math.sin(cameraYaw)
);

direction
.set(0,0,0)
.addScaledVector(right,moveX)
.addScaledVector(forward,-moveY);

if(direction.length()>0){
  direction.normalize();

  // Smooth on-foot movement, tuned for mobile.
  const speed=.15;
  player.position.addScaledVector(direction,speed);

  const targetRotation=Math.atan2(direction.x,direction.z);
  player.rotation.y +=
    Math.atan2(
      Math.sin(targetRotation-player.rotation.y),
      Math.cos(targetRotation-player.rotation.y)
    )*.22;
}

}


/* CAMERA FOLLOW */

const desiredCamera =
new THREE.Vector3();

const cameraTarget =
new THREE.Vector3();


function updateCamera(){

const target =
driving ? car : player;

if(!target)return;


cameraTarget.set(
target.position.x,
target.position.y+1.5,
target.position.z
);


const distance=driving ? 15 : 12;

const horizontal =
Math.cos(cameraPitch)*
distance;


desiredCamera.set(

target.position.x+
Math.sin(cameraYaw)*
horizontal,

target.position.y+
2+
Math.sin(cameraPitch)*
distance,

target.position.z+
Math.cos(cameraYaw)*
horizontal

);


camera.position.lerp(
desiredCamera,
.12
);

camera.lookAt(
cameraTarget
);

}

"resize",
()=>{

camera.aspect =
innerWidth/innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
innerWidth,
innerHeight
);

}
);


/* MULTIPLAYER */
const remotePlayers = new Map();
let socket = null;
let myPlayerId = null;
function createRemotePlayer(){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.CapsuleGeometry(.42,1.15,6,10),new THREE.MeshStandardMaterial({color:0x1976d2}));
  body.position.y=1; body.castShadow=true; g.add(body);
  const head=new THREE.Mesh(new THREE.SphereGeometry(.32,12,12),new THREE.MeshStandardMaterial({color:0x8d5524}));
  head.position.y=1.85; head.castShadow=true; g.add(head);
  scene.add(g); return g;
}
function connectMultiplayer(){
  const protocol=location.protocol==="https:"?"wss:":"ws:";
  socket=new WebSocket(protocol+"//"+location.host);
  socket.addEventListener("open",()=>document.getElementById("status").textContent="Online • Abuja multiplayer");
  socket.addEventListener("message",(event)=>{
    try{const data=JSON.parse(event.data);
      if(data.type==="welcome"){myPlayerId=data.id;return;}
      if(data.type==="players"){
        const seen=new Set();
        for(const [id,p] of Object.entries(data.players)){
          if(id===myPlayerId)continue; seen.add(id);
          let remote=remotePlayers.get(id);
          if(!remote){remote=createRemotePlayer();remote.position.set(p.x,p.y,p.z);remote.rotation.y=p.rotation||0;remotePlayers.set(id,remote);}
          remote.userData.targetX=p.x; remote.userData.targetY=p.y; remote.userData.targetZ=p.z; remote.userData.targetRotation=p.rotation||0;
        }
        for(const [id,remote] of remotePlayers){if(!seen.has(id)){scene.remove(remote);remotePlayers.delete(id);}}
      }
    }catch(error){console.error("Multiplayer message error",error);}
  });
  socket.addEventListener("close",()=>{document.getElementById("status").textContent="Offline • Reconnecting...";setTimeout(connectMultiplayer,2000);});
  socket.addEventListener("error",()=>document.getElementById("status").textContent="Connection problem");
}
function sendPlayerState(){
  if(!socket||socket.readyState!==WebSocket.OPEN)return;
  const target=driving?car:player;if(!target)return;
  socket.send(JSON.stringify({type:"position",x:target.position.x,y:target.position.y,z:target.position.z,rotation:target.rotation.y}));
}
function updateRemotePlayers(){
  for(const remote of remotePlayers.values()){
    if(remote.userData.targetX===undefined)continue;
    remote.position.x+=(remote.userData.targetX-remote.position.x)*.18;
    remote.position.y+=(remote.userData.targetY-remote.position.y)*.18;
    remote.position.z+=(remote.userData.targetZ-remote.position.z)*.18;
    const r=remote.userData.targetRotation||0;
    remote.rotation.y+=Math.atan2(Math.sin(r-remote.rotation.y),Math.cos(r-remote.rotation.y))*.18;
  }
}
connectMultiplayer();
setInterval(sendPlayerState,100);

/* GAME LOOP */

function animate(){

requestAnimationFrame(
animate
);

updateMovement();
updateCar();

updateCamera();
updateRemotePlayers();


if(mixer){

mixer.update(
0.016
);

}


renderer.render(
scene,
camera
);

}

animate();

</script>
