<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>AbujaLifestyle</title>

<style>
* {
  box-sizing: border-box;
  user-select: none;
  -webkit-user-select: none;
}

body {
  margin: 0;
  overflow: hidden;
  background: #79a95b;
  font-family: Arial, sans-serif;
}

#game {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: #79a95b;
}

/* SKY */
#sky {
  position: absolute;
  top: 0;
  width: 100%;
  height: 35%;
  background: linear-gradient(#79c9ed, #cceeff);
}

/* CITY */
.city {
  position: absolute;
  bottom: 55%;
  width: 70px;
  background: #777;
  border: 2px solid #444;
}

.city1 { left: 3%; height: 100px; }
.city2 { left: 15%; height: 140px; background:#9b8066; }
.city3 { right: 14%; height: 125px; background:#888; }
.city4 { right: 2%; height: 90px; background:#a27b62; }

/* ROAD */
#road {
  position: absolute;
  left: 10%;
  width: 80%;
  height: 100%;
  background: #343434;
}

#road::before,
#road::after {
  content: "";
  position: absolute;
  top: 0;
  width: 5px;
  height: 100%;
  background: #f5f5f5;
}

#road::before {
  left: 2%;
}

#road::after {
  right: 2%;
}

/* ROAD LINES */
.line {
  position: absolute;
  width: 8px;
  height: 80px;
  background: white;
  left: 50%;
  transform: translateX(-50%);
}

/* CAR */
#car {
  position: absolute;
  width: 55px;
  height: 95px;
  bottom: 125px;
  left: 50%;
  transform: translateX(-50%);
  background: #d71920;
  border-radius: 14px;
  border: 3px solid #111;
  z-index: 10;
}

#car::before {
  content: "";
  position: absolute;
  top: 12px;
  left: 9px;
  width: 31px;
  height: 27px;
  background: #9ed9ed;
  border-radius: 6px;
}

#car::after {
  content: "";
  position: absolute;
  bottom: 12px;
  left: 9px;
  width: 31px;
  height: 22px;
  background: #222;
  border-radius: 5px;
}

/* HUD */
#hud {
  position: absolute;
  top: 15px;
  left: 15px;
  right: 15px;
  display: flex;
  justify-content: space-between;
  z-index: 20;
}

.box {
  background: rgba(0,0,0,.7);
  color: white;
  padding: 10px 14px;
  border-radius: 10px;
  font-weight: bold;
}

/* CONTROLS */
#controls {
  position: absolute;
  bottom: 20px;
  left: 0;
  right: 0;
  display: flex;
  justify-content: space-between;
  padding: 0 25px;
  z-index: 20;
}

.control {
  width: 75px;
  height: 75px;
  border-radius: 50%;
  border: 2px solid white;
  background: rgba(0,0,0,.65);
  color: white;
  font-size: 32px;
}

#message {
  position: absolute;
  top: 75px;
  width: 100%;
  text-align: center;
  color: white;
  font-size: 20px;
  font-weight: bold;
  text-shadow: 2px 2px 4px black;
  z-index: 20;
}
</style>
</head>

<body>

<div id="game">

  <div id="sky"></div>

  <div class="city city1"></div>
  <div class="city city2"></div>
  <div class="city city3"></div>
  <div class="city city4"></div>

  <div id="road">

    <div class="line" style="top:0"></div>
    <div class="line" style="top:160px"></div>
    <div class="line" style="top:320px"></div>
    <div class="line" style="top:480px"></div>
    <div class="line" style="top:640px"></div>

  </div>

  <div id="car"></div>

  <div id="hud">
    <div class="box">🇳🇬 Abuja</div>
    <div class="box">💰 ₦25,000</div>
  </div>

  <div id="message">
    Welcome to AbujaLifestyle
  </div>

  <div id="controls">
    <button class="control" onclick="moveLeft()">◀</button>
    <button class="control" onclick="moveRight()">▶</button>
  </div>

</div>

<script>

const car = document.getElementById("car");

let carPosition = 50;

function moveLeft() {
  carPosition -= 5;

  if (carPosition < 16) {
    carPosition = 16;
  }

  car.style.left = carPosition + "%";
}

function moveRight() {
  carPosition += 5;

  if (carPosition > 84) {
    carPosition = 84;
  }

  car.style.left = carPosition + "%";
}

/* Keyboard controls */
document.addEventListener("keydown", function(event) {

  if (event.key === "ArrowLeft") {
    moveLeft();
  }

  if (event.key === "ArrowRight") {
    moveRight();
  }

});

</script>

</body>
</html>
