let playerReady=false;

async function loadPlayerModel(){
  try{
    const module=await import(
      "https://esm.sh/three@0.160.0/examples/jsm/loaders/GLTFLoader.js"
    );

    const loader=new module.GLTFLoader();

    loader.load(
      "./Superhero_Male_FullBody.gltf",
      (gltf)=>{
        const model=gltf.scene;

        // This character asset is already authored at game-ready human scale.
        // Do not normalize with Box3: skinned meshes can report an incorrect
        // pre-skin bounding box and become massively oversized.
        model.scale.setScalar(1.0);
        model.position.set(0,0,0);

        model.traverse((object)=>{
          if(!object.isMesh)return;

          object.castShadow=true;
          object.receiveShadow=true;

          if(object.material){
            const materials=Array.isArray(object.material)
              ?object.material
              :[object.material];

            materials.forEach((material)=>{
              if("side" in material){
                material.side=THREE.FrontSide;
              }
            });
          }
        });

        player.add(model);
        playerReady=true;

        console.log("AbujaLifestyle: REAL 3D PLAYER LOADED");
      },
      undefined,
      (error)=>{
        console.error("PLAYER MODEL ERROR:",error);
      }
    );
  }catch(error){
    console.error("PLAYER LOADER ERROR:",error);
  }
}

    },

  );

      keys[key]=false;
    },
    {passive:false}
  );

  b.addEventListener(
    "touchcancel",
    ()=>{
      keys[key]=false;
    }
  );

  b.addEventListener(
    "mousedown",
    ()=>{
      keys[key]=true;
    }
  );

  b.addEventListener(
    "mouseup",
    ()=>{
      keys[key]=false;
    }
  );

  b.addEventListener(
    "mouseleave",
    ()=>{
      keys[key]=false;
    }
  );
}

/* =====================================================
   CAMERA
===================================================== */

let orbit=0;
let pitch=.45;

let touching=false;
let lastX=0;
let lastY=0;

canvas.addEventListener(
  "touchstart",
  e=>{
    if(e.touches.length!==1)return;

    touching=true;
    lastX=e.touches[0].clientX;
    lastY=e.touches[0].clientY;
  },
  {passive:true}
);

canvas.addEventListener(
  "touchmove",
  e=>{
    if(!touching)return;

    const x=e.touches[0].clientX;
    const y=e.touches[0].clientY;

    orbit-=(x-lastX)*.006;
    pitch-=(y-lastY)*.004;

    pitch=Math.max(.15,Math.min(1.1,pitch));

    lastX=x;
    lastY=y;
  },
  {passive:true}
);

canvas.addEventListener(
  "touchend",
  ()=>{
    touching=false;
  },
  {passive:true}
);

/* =====================================================
   MULTIPLAYER
===================================================== */

let socket=null;
let myId=null;
const otherPlayers={};

function connect(){

  try{

    const protocol=
      location.protocol==="https:"?"wss:":"ws:";

    socket=new WebSocket(
      protocol+"//"+location.host
    );

    socket.onopen=function(){
      online.textContent="ONLINE";
      online.style.background=
        "rgba(0,120,40,.75)";
    };

    socket.onmessage=function(event){

      try{

        const data=JSON.parse(event.data);

        if(data.type==="welcome")
          myId=data.id;

        if(data.type==="players"){

          const active={};

          for(const id in data.players){

            if(id===myId)continue;

            active[id]=true;

            if(!otherPlayers[id]){

              const p=new THREE.Mesh(
                new THREE.BoxGeometry(2,1.4,4),
                mat(0x2449a8)
              );

              p.position.y=.8;
              scene.add(p);
              otherPlayers[id]=p;
            }

            const p=otherPlayers[id];
            const d=data.players[id];

            p.position.set(
              d.x,
              d.y+.8,
              d.z
            );

            p.rotation.y=d.rotation;
          }

          for(const id in otherPlayers){

            if(!active[id]){

              scene.remove(otherPlayers[id]);
              delete otherPlayers[id];
            }
          }
        }

      }catch(err){
        console.log(err);
      }
    };

    socket.onclose=function(){
      online.textContent="OFFLINE";
      online.style.background=
        "rgba(120,70,0,.75)";
    };

    socket.onerror=function(){
      online.textContent="OFFLINE";
    };

  }catch(err){
    online.textContent="OFFLINE";
  }
}


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
  "resize",
  ()=>{
    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
  }
);


/* =====================================================
   GAME LOOP
===================================================== */

function animate(){

  requestAnimationFrame(animate);

  if(!walking && !inside){
    car.update(keys);
  }


  /* PLAYER MOVEMENT */

  if(walking){

    let dx=0;
    let dz=0;

    if(keys.w)dz-=1;
    if(keys.s)dz+=1;
    if(keys.a)dx-=1;
    if(keys.d)dx+=1;

    if(dx!==0 || dz!==0){

      const len=Math.sqrt(dx*dx+dz*dz);

      dx/=len;
      dz/=len;

      const speed=inside?.075:.12;

      player.position.x+=dx*speed;
      player.position.z+=dz*speed;

      player.rotation.y=Math.atan2(dx,dz);
    }

    if(inside){

      player.position.x=Math.max(
        house.x-7.2,
        Math.min(house.x+7.2,player.position.x)
      );

      player.position.z=Math.max(
        house.z-5.2,
        Math.min(house.z+5.5,player.position.z)
      );
    }
  }


  /* GET IN CAR */

  if(!inside && walking){

    const dx=
      player.position.x-car.group.position.x;

    const dz=
      player.position.z-car.group.position.z;

    const distance=Math.sqrt(dx*dx+dz*dz);

    if(distance<4){
      getInButton.style.display="block";
    }else{
      getInButton.style.display="none";
    }
  }


  /* ENTER HOUSE */

  if(!inside && !walking){

    if(doorDistance()<13){
      enterButton.style.display="block";
    }else{
      enterButton.style.display="none";
    }
  }


  /* MULTIPLAYER */

  if(
    socket &&
    socket.readyState===WebSocket.OPEN
  ){

    const object=
      walking ? player : car.group;

    socket.send(
      JSON.stringify({
        type:"position",
        x:object.position.x,
        y:object.position.y,
        z:object.position.z,
        rotation:object.rotation.y
      })
    );
  }


  /* CAMERA */

  const target=
    walking
      ?player.position.clone()
      :car.group.position.clone();

  target.y+=walking?1.2:1.8;

  const distance=walking?9:13;

  const horizontal=
    Math.cos(pitch)*distance;

  const vertical=
    Math.sin(pitch)*distance;

  const cx=
    target.x+
    Math.sin(orbit)*horizontal;

  const cz=
    target.z+
    Math.cos(orbit)*horizontal;

  camera.position.x+=
    (cx-camera.position.x)*.08;

  camera.position.y+=
    (target.y+vertical-camera.position.y)*.08;

  camera.position.z+=
    (cz-camera.position.z)*.08;

  camera.lookAt(target);

  renderer.render(scene,camera);
}


/* =====================================================
   START
===================================================== */

online.textContent="CONNECTING...";

getOutButton.style.display="block";
getInButton.style.display="none";
enterButton.style.display="none";
exitButton.style.display="none";

connect();
animate();

}catch(error){

  const box=document.getElementById("online");

  box.textContent=
    "GAME ERROR: "+error.message;

  box.style.background="#c62828";
}

</script>
