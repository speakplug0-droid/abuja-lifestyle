<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AbujaLifestyle</title>

<style>
* {
  box-sizing: border-box;
  user-select: none;
  touch-action: none;
}

body {
  margin: 0;
  overflow: hidden;
  background: #6fa34f;
  font-family: Arial, sans-serif;
}

#game {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: #6fa34f;
}

/* SKY */
#sky {
  position: absolute;
  width: 100%;
  height: 45%;
  background: linear-gradient(#65bde8, #d7f2ff);
}

/* GROUND */
#ground {
  position: absolute;
  top: 40%;
  width: 100%;
  height: 60%;
  background: #6fa34f;
}

/* ROAD */
#road {
  position: absolute;
  left: 20%;
  top: 0;
  width: 60%;
  height: 100%;
  background: #333;
}

.road-line {
  position: absolute;
  left: 50%;
  width: 7px;
  height: 80px;
  background: white;
  transform: translateX(-50%);
}

/* BUILDINGS */
.building {
  position: absolute;
  background: #8d735f;
  border: 3px solid #544438;
  bottom: 38%;
}

.b1 {
  left: 2%;
  width: 85px;
  height: 150px;
}

.b2 {
  left: 12%;
  width: 70px;
  height: 110px;
  background: #a68a70;
}

.b3 {
  right: 12%;
  width: 80px;
  height: 135px;
  background: #777;
}

.b4 {
  right: 2%;
  width: 90px;
  height: 170px;
  background: #96745f;
}

/* PLAYER */
#player {
  position: absolute;
  width: 38px;
  height: 58px;
  left: 50%;
  top: 55%;
  transform: translate(-50%, -50%);
  z-index: 10;
}

.head {
  position: absolute;
  width: 25px;
  height: 25px;
  background: #8d5524;
  border-radius: 50%;
  left: 7px;
  top: 0;
}

.body {
  position: absolute;
  width: 32px;
  height: 35px;
  background: #111;
  border-radius: 9px 9px 4px 4px;
  left: 3px;
  top: 23px;
}

/* HUD */
#hud {
  position: absolute;
  top: 15px;
  left: 15px;
  right: 15px;
  display: flex;
  justify-content: space-between;
  z-index: 20;
}

.hud-box {
  background: rgba(0,0,0,.7);
  color: white;
  padding: 9px 12px;
  border-radius: 10px;
  font-weight: bold;
}

/* JOYSTICK */
#joystick {
  position: absolute;
  left: 25px;
  bottom: 25px;
  width: 120px;
  height: 120px;
  background: rgba(0,0,0,.3);
  border: 2px solid rgba(255,255,255,.7);
  border-radius: 50%;
  z-index: 30;
}

#stick {
  position: absolute;
  width: 55px;
  height: 55px;
  background: rgba(255,255,255,.85);
  border-radius: 50%;
  left: 30px;
  top: 30px;
}

/* ACTION BUTTON */
#action {
  position: absolute;
  right: 30px;
  bottom: 45px;
  width: 75px;
  height: 75px;
  border-radius: 50%;
  border: 2px solid white;
  background: rgba(0,0,0,.65);
  color: white;
  font-weight: bold;
  z-index: 30;
}

/* TITLE */
#title {
  position: absolute;
  top: 70px;
  width: 100%;
  text-align: center;
  color: white;
  font-size: 20px;
  font-weight: bold;
  text-shadow: 2px 2px 4px #000;
  z-index: 20;
}
</style>
</head>

<body>

<div id="game">

  <div id="sky"></div>
  <div id="ground"></div>

  <div id="road">
    <div class="road-line" style="top:0"></div>
    <div class="road-line" style="top:170px"></div>
    <div class="road-line" style="top:340px"></div>
    <div class="road-line" style="top:510px"></div>
    <div class="road-line" style="top:680px"></div>
  </div>

  <div class="building b1"></div>
  <div class="building b2"></div>
  <div class="building b3"></div>
  <div class="building b4"></div>

  <div id="player">
    <div class="head"></div>
    <div class="body"></div>
  </div>

  <div id="hud">
    <div class="hud-box">🇳🇬 ABUJA</div>
    <div class="hud-box">💰 ₦25,000</div>
  </div>

  <div id="title">
    AbujaLifestyle
  </div>

  <div id="joystick">
    <div id="stick"></div>
  </div>

  <button id="action">ACTION</button>

</div>

<script>
const player = document.getElementById("player");
const joystick = document.getElementById("joystick");
const stick = document.getElementById("stick");

let x = 50;
let y = 55;

let dragging = false;

function movePlayer(dx, dy) {
  x += dx;
  y += dy;

  if (x < 3) x = 3;
  if (x > 97) x = 97;

  if (y < 42) y = 42;
  if (y > 90) y = 90;

  player.style.left = x + "%";
  player.style.top = y + "%";
}

joystick.addEventListener("pointerdown", function(e) {
  dragging = true;
  joystick.setPointerCapture(e.pointerId);
});

joystick.addEventListener("pointermove", function(e) {

  if (!dragging) return;

  const rect = joystick.getBoundingClientRect();

  const centerX = rect.left + rect.width / 2;
  const centerY = rect.top + rect.height / 2;

  let dx = e.clientX - centerX;
  let dy = e.clientY - centerY;

  const distance = Math.sqrt(dx * dx + dy * dy);
  const maxDistance = 35;

  if (distance > maxDistance) {
    dx = dx / distance * maxDistance;
    dy = dy / distance * maxDistance;
  }

  stick.style.left = (30 + dx) + "px";
  stick.style.top = (30 + dy) + "px";

  movePlayer(dx * 0.08, dy * 0.08);
});

joystick.addEventListener("pointerup", function() {
  dragging = false;

  stick.style.left = "30px";
  stick.style.top = "30px";
});

</script>

</body>
</html>
