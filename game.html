<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AbujaLifestyle</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#78c9ff;
}

#game{
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
  background:linear-gradient(#72c8ff 0 52%,#70b85d 52% 100%);
}

/* SUN */
.sun{
  position:absolute;
  width:70px;
  height:70px;
  border-radius:50%;
  background:#ffd84d;
  top:45px;
  right:45px;
  box-shadow:0 0 35px #ffd84d;
}

/* CLOUDS */
.cloud{
  position:absolute;
  width:120px;
  height:35px;
  border-radius:30px;
  background:white;
  opacity:.8;
}

.cloud:before,
.cloud:after{
  content:"";
  position:absolute;
  background:white;
  border-radius:50%;
}

.cloud:before{
  width:55px;
  height:55px;
  left:18px;
  top:-28px;
}

.cloud:after{
  width:65px;
  height:65px;
  right:15px;
  top:-35px;
}

.cloud1{top:90px;left:40px}
.cloud2{top:150px;left:55%;transform:scale(.7)}

/* CITY */
.city{
  position:absolute;
  bottom:48%;
  left:0;
  width:100%;
  height:170px;
}

.building{
  position:absolute;
  bottom:0;
  background:linear-gradient(90deg,#c9c9c9,#f1f1f1,#bdbdbd);
  border:2px solid #777;
}

.building:after{
  content:"";
  position:absolute;
  inset:12px;
  background:
    repeating-linear-gradient(
      90deg,
      #315c78 0 18px,
      transparent 18px 30px
    ),
    repeating-linear-gradient(
      0deg,
      transparent 0 20px,
      #315c78 20px 28px
    );
}

.b1{left:3%;width:90px;height:105px}
.b2{left:17%;width:120px;height:145px}
.b3{left:36%;width:100px;height:120px}
.b4{right:19%;width:130px;height:155px}
.b5{right:2%;width:95px;height:115px}

/* ROAD */
.road{
  position:absolute;
  left:0;
  bottom:0;
  width:100%;
  height:45%;
  background:#35383c;
  border-top:8px solid #777;
}

.road:before{
  content:"";
  position:absolute;
  top:50%;
  left:0;
  width:100%;
  height:8px;
  background:repeating-linear-gradient(
    90deg,
    #fff 0 55px,
    transparent 55px 105px
  );
}

/* SIDEWALK */
.sidewalk{
  position:absolute;
  left:0;
  bottom:42%;
  width:100%;
  height:32px;
  background:#bdbdbd;
  border-top:3px solid #888;
  border-bottom:3px solid #888;
}

/* HUD */
.hud{
  position:absolute;
  top:15px;
  left:15px;
  right:15px;
  display:flex;
  justify-content:space-between;
  z-index:30;
}

.hudBox{
  background:rgba(0,0,0,.65);
  color:white;
  padding:10px 14px;
  border-radius:12px;
  font-weight:bold;
  font-size:14px;
}

/* PLAYER */
#player{
  position:absolute;
  width:52px;
  height:100px;
  z-index:15;
  transition:transform .05s linear;
}

.player-shadow{
  position:absolute;
  width:48px;
  height:12px;
  left:2px;
  bottom:-3px;
  border-radius:50%;
  background:rgba(0,0,0,.35);
}

.head{
  position:absolute;
  width:32px;
  height:34px;
  left:10px;
  top:3px;
  border-radius:48% 48% 45% 45%;
  background:#9a5a35;
  border:2px solid #62351f;
}

.hair{
  position:absolute;
  width:34px;
  height:15px;
  left:9px;
  top:0;
  border-radius:18px 18px 5px 5px;
  background:#161616;
}

.eye{
  position:absolute;
  width:4px;
  height:4px;
  border-radius:50%;
  background:#111;
  top:19px;
}

.eye.left{left:17px}
.eye.right{left:27px}

.body{
  position:absolute;
  width:38px;
  height:43px;
  left:7px;
  top:36px;
  border-radius:9px 9px 5px 5px;
  background:linear-gradient(#202b38,#101820);
  border:2px solid #090d12;
}

.shirt{
  position:absolute;
  width:25px;
  height:5px;
  left:14px;
  top:42px;
  background:#e6e6e6;
  border-radius:5px;
}

.arm{
  position:absolute;
  width:10px;
  height:39px;
  top:39px;
  border-radius:8px;
  background:#925331;
  border:2px solid #62351f;
}

.arm.left{left:1px;transform:rotate(7deg)}
.arm.right{right:1px;transform:rotate(-7deg)}

.leg{
  position:absolute;
  width:13px;
  height:32px;
  top:77px;
  border-radius:5px;
  background:#20242a;
}

.leg.left{left:10px}
.leg.right{right:10px}

.shoe{
  position:absolute;
  width:19px;
  height:9px;
  background:#111;
  border-radius:8px 4px 4px 8px;
  top:96px;
}

.shoe.left{left:4px}
.shoe.right{right:4px}

/* VELAR */
#car{
  position:absolute;
  width:170px;
  height:76px;
  z-index:14;
}

.car-shadow{
  position:absolute;
  width:150px;
  height:18px;
  left:10px;
  bottom:0;
  background:rgba(0,0,0,.45);
  border-radius:50%;
}

.car-body{
  position:absolute;
  width:165px;
  height:48px;
  left:2px;
  bottom:13px;
  border-radius:17px 22px 10px 10px;
  background:linear-gradient(
    180deg,
    #3b4148 0%,
    #15191d 38%,
    #080a0c 100%
  );
  border:2px solid #050607;
  box-shadow:
    inset 0 5px 5px rgba(255,255,255,.12),
    0 5px 8px rgba(0,0,0,.35);
}

.roof{
  position:absolute;
  width:105px;
  height:35px;
  left:30px;
  top:-25px;
  border-radius:42px 48px 5px 5px;
  background:#15191d;
  border:2px solid #050607;
}

.window{
  position:absolute;
  top:4px;
  height:25px;
  background:linear-gradient(135deg,#38546a,#101820);
  border:1px solid #536b7b;
}

.window.front{
  width:43px;
  left:55px;
  clip-path:polygon(15% 0,100% 0,88% 100%,0 100%);
}

.window.back{
  width:34px;
  left:12px;
  clip-path:polygon(0 0,100% 0,100% 100%,10% 100%);
}

.grille{
  position:absolute;
  right:-2px;
  top:17px;
  width:26px;
  height:18px;
  border-radius:3px;
  background:repeating-linear-gradient(
    0deg,
    #9fa5aa 0 2px,
    #222 2px 4px
  );
  border:2px solid #777;
}

.headlight{
  position:absolute;
  right:25px;
  top:9px;
  width:23px;
  height:8px;
  background:#eaf8ff;
  border-radius:8px;
  box-shadow:0 0 10px #dff8ff;
  transform:skewX(-20deg);
}

.headlight2{
  position:absolute;
  left:8px;
  top:9px;
  width:20px;
  height:8px;
  background:#eaf8ff;
  border-radius:8px;
  box-shadow:0 0 10px #dff8ff;
  transform:skewX(20deg);
}

.handle{
  position:absolute;
  width:11px;
  height:3px;
  background:#aaa;
  top:19px;
  left:95px;
  border-radius:3px;
}

.wheel{
  position:absolute;
  width:30px;
  height:30px;
  bottom:-8px;
  border-radius:50%;
  background:#080808;
  border:4px solid #25282b;
  box-shadow:inset 0 0 0 4px #111;
}

.wheel:after{
  content:"";
  position:absolute;
  width:10px;
  height:10px;
  left:6px;
  top:6px;
  border-radius:50%;
  background:#aaa;
  border:2px solid #444;
}

.wheel.left{left:18px}
.wheel.right{right:18px}

.tail{
  position:absolute;
  left:0;
  top:14px;
  width:12px;
  height:9px;
  background:#d60000;
  border-radius:3px;
}

/* CONTROLS */
#joystick{
  position:absolute;
  bottom:25px;
  left:25px;
  width:105px;
  height:105px;
  border-radius:50%;
  background:rgba(255,255,255,.18);
  border:2px solid rgba(255,255,255,.4);
  z-index:50;
}

#stick{
  position:absolute;
  width:52px;
  height:52px;
  left:24px;
  top:24px;
  border-radius:50%;
  background:rgba(255,255,255,.65);
  box-shadow:0 3px 10px rgba(0,0,0,.3);
}

#action{
  position:absolute;
  bottom:35px;
  right:28px;
  width:90px;
  height:90px;
  border:0;
  border-radius:50%;
  background:rgba(15,15,15,.8);
  color:white;
  font-weight:bold;
  font-size:15px;
  border:3px solid rgba(255,255,255,.5);
  z-index:50;
}

#status{
  position:absolute;
  top:68px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.65);
  color:white;
  padding:9px 15px;
  border-radius:20px;
  font-size:13px;
  z-index:30;
  white-space:nowrap;
}
</style>
</head>

<body>

<div id="game">

  <div class="sun"></div>
  <div class="cloud cloud1"></div>
  <div class="cloud cloud2"></div>

  <div class="city">
    <div class="building b1"></div>
    <div class="building b2"></div>
    <div class="building b3"></div>
    <div class="building b4"></div>
    <div class="building b5"></div>
  </div>

  <div class="sidewalk"></div>
  <div class="road"></div>

  <div class="hud">
    <div class="hudBox">🇳🇬 ABUJA</div>
    <div class="hudBox">💰 ₦25,000</div>
  </div>

  <div id="status">Walk to the Velar and press ACTION</div>

  <!-- PLAYER -->
  <div id="player" style="left:35%;top:65%;">
    <div class="player-shadow"></div>
    <div class="head">
      <div class="eye left"></div>
      <div class="eye right"></div>
    </div>
    <div class="hair"></div>
    <div class="body"></div>
    <div class="shirt"></div>
    <div class="arm left"></div>
    <div class="arm right"></div>
    <div class="leg left"></div>
    <div class="leg right"></div>
    <div class="shoe left"></div>
    <div class="shoe right"></div>
  </div>

  <!-- RANGE ROVER VELAR STYLE -->
  <div id="car" style="left:58%;top:67%;">
    <div class="car-shadow"></div>

    <div class="car-body">
      <div class="roof">
        <div class="window back"></div>
        <div class="window front"></div>
      </div>

      <div class="tail"></div>
      <div class="headlight"></div>
      <div class="headlight2"></div>
      <div class="grille"></div>
      <div class="handle"></div>

      <div class="wheel left"></div>
      <div class="wheel right"></div>
    </div>
  </div>

  <div id="joystick">
    <div id="stick"></div>
  </div>

  <button id="action">ACTION</button>

</div>

<script>
const player = document.getElementById("player");
const car = document.getElementById("car");
const stick = document.getElementById("stick");
const joystick = document.getElementById("joystick");
const action = document.getElementById("action");
const statusText = document.getElementById("status");

let playerX = 35;
let playerY = 65;

let carX = 58;
let carY = 67;

let driving = false;
let moveX = 0;
let moveY = 0;

function updatePositions(){
  if(driving){
    carX += moveX * 0.12;
    carY += moveY * 0.10;

    carX = Math.max(2,Math.min(82,carX));
    carY = Math.max(48,Math.min(84,carY));

    car.style.left = carX + "%";
    car.style.top = carY + "%";
  }else{
    playerX += moveX * 0.10;
    playerY += moveY * 0.10;

    playerX = Math.max(2,Math.min(94,playerX));
    playerY = Math.max(48,Math.min(84,playerY));

    player.style.left = playerX + "%";
    player.style.top = playerY + "%";
  }
}

setInterval(updatePositions,30);

/* JOYSTICK */
let touching = false;

function joystickMove(clientX,clientY){
  const rect = joystick.getBoundingClientRect();

  let dx = clientX - (rect.left + rect.width/2);
  let dy = clientY - (rect.top + rect.height/2);

  const distance = Math.sqrt(dx*dx + dy*dy);
  const max = 27;

  if(distance > max){
    dx = dx / distance * max;
    dy = dy / distance * max;
  }

  stick.style.transform = `translate(${dx}px,${dy}px)`;

  moveX = dx / max;
  moveY = dy / max;
}

joystick.addEventListener("touchstart",e=>{
  touching=true;
  const t=e.touches[0];
  joystickMove(t.clientX,t.clientY);
});

joystick.addEventListener("touchmove",e=>{
  if(!touching)return;
  const t=e.touches[0];
  joystickMove(t.clientX,t.clientY);
});

joystick.addEventListener("touchend",()=>{
  touching=false;
  moveX=0;
  moveY=0;
  stick.style.transform="translate(0,0)";
});

/* ACTION */
action.addEventListener("click",()=>{
  if(!driving){
    driving=true;
    player.style.display="none";
    statusText.textContent="🚙 Driving the Velar";
  }else{
    driving=false;

    playerX=carX+9;
    playerY=carY+2;

    player.style.left=playerX+"%";
    player.style.top=playerY+"%";
    player.style.display="block";

    statusText.textContent="Walk to the Velar and press ACTION";
  }
});
</script>

</body>
</html>
