<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AbujaLifestyle</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
}

#game{
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
  background:linear-gradient(#62c5ff 0 50%,#68ad55 50%);
}

/* SKY */
.sun{
  position:absolute;
  width:65px;
  height:65px;
  right:35px;
  top:45px;
  border-radius:50%;
  background:#ffd83d;
  box-shadow:0 0 35px #ffe77a;
}

.cloud{
  position:absolute;
  width:110px;
  height:30px;
  border-radius:30px;
  background:white;
  opacity:.8;
}
.cloud:before,.cloud:after{
  content:"";
  position:absolute;
  background:white;
  border-radius:50%;
}
.cloud:before{
  width:50px;height:50px;left:15px;top:-25px;
}
.cloud:after{
  width:58px;height:58px;right:12px;top:-30px;
}
.cloud1{left:35px;top:85px}
.cloud2{left:55%;top:135px;transform:scale(.7)}

/* BUILDINGS */
.city{
  position:absolute;
  bottom:50%;
  left:0;
  width:100%;
  height:170px;
}

.building{
  position:absolute;
  bottom:0;
  border:2px solid #777;
  background:linear-gradient(90deg,#bfc1c3,#eeeeee,#b7b9bb);
}

.building:after{
  content:"";
  position:absolute;
  inset:12px;
  background:
    repeating-linear-gradient(90deg,#28536d 0 15px,transparent 15px 27px),
    repeating-linear-gradient(0deg,transparent 0 19px,#28536d 19px 27px);
}

.b1{left:2%;width:85px;height:100px}
.b2{left:16%;width:115px;height:145px}
.b3{left:35%;width:95px;height:115px}
.b4{right:18%;width:125px;height:155px}
.b5{right:1%;width:90px;height:110px}

/* ROAD */
.sidewalk{
  position:absolute;
  left:0;
  bottom:42%;
  width:100%;
  height:30px;
  background:#b9b9b9;
  border-top:3px solid #888;
  border-bottom:3px solid #888;
}

.road{
  position:absolute;
  left:0;
  bottom:0;
  width:100%;
  height:43%;
  background:#303338;
  border-top:7px solid #777;
}

.road:after{
  content:"";
  position:absolute;
  top:50%;
  left:0;
  width:100%;
  height:7px;
  background:repeating-linear-gradient(
    90deg,
    white 0 55px,
    transparent 55px 105px
  );
}

/* HUD */
.hud{
  position:absolute;
  z-index:50;
  top:14px;
  left:14px;
  right:14px;
  display:flex;
  justify-content:space-between;
}

.hudBox{
  padding:10px 14px;
  border-radius:12px;
  background:rgba(0,0,0,.7);
  color:white;
  font-weight:bold;
}

#status{
  position:absolute;
  z-index:50;
  top:64px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.7);
  color:white;
  padding:9px 14px;
  border-radius:20px;
  font-size:13px;
  white-space:nowrap;
}

/* HUMAN */
#player{
  position:absolute;
  width:52px;
  height:102px;
  z-index:20;
}

.playerShadow{
  position:absolute;
  width:48px;
  height:12px;
  bottom:-2px;
  left:2px;
  border-radius:50%;
  background:rgba(0,0,0,.4);
}

.head{
  position:absolute;
  width:34px;
  height:35px;
  left:9px;
  top:2px;
  border-radius:48%;
  background:#985a37;
  border:2px solid #60351f;
}

.hair{
  position:absolute;
  width:35px;
  height:16px;
  left:8px;
  top:0;
  border-radius:18px 18px 5px 5px;
  background:#151515;
}

.eye{
  position:absolute;
  width:4px;
  height:4px;
  top:19px;
  border-radius:50%;
  background:#111;
}
.eye1{left:17px}
.eye2{left:28px}

.body{
  position:absolute;
  width:39px;
  height:44px;
  left:6px;
  top:36px;
  border-radius:9px;
  background:linear-gradient(#273746,#101820);
  border:2px solid #080c10;
}

.arm{
  position:absolute;
  width:10px;
  height:39px;
  top:39px;
  border-radius:8px;
  background:#925431;
}
.arm1{left:0;transform:rotate(8deg)}
.arm2{right:0;transform:rotate(-8deg)}

.leg{
  position:absolute;
  width:13px;
  height:33px;
  top:78px;
  background:#20242a;
  border-radius:5px;
}
.leg1{left:10px}
.leg2{right:10px}

.shoe{
  position:absolute;
  width:20px;
  height:9px;
  top:96px;
  border-radius:8px;
  background:#090909;
}
.shoe1{left:3px}
.shoe2{right:3px}

/* VELAR */
#car{
  position:absolute;
  width:190px;
  height:88px;
  z-index:19;
}

.carShadow{
  position:absolute;
  width:170px;
  height:17px;
  left:10px;
  bottom:0;
  border-radius:50%;
  background:rgba(0,0,0,.5);
}

.carBody{
  position:absolute;
  left:2px;
  bottom:14px;
  width:185px;
  height:51px;
  border-radius:13px 25px 9px 9px;
  background:
    linear-gradient(#454b51,#171b1f 45%,#07090a);
  border:2px solid #050607;
  box-shadow:inset 0 5px 7px rgba(255,255,255,.14);
}

/* ROOF */
.roof{
  position:absolute;
  left:34px;
  top:-29px;
  width:112px;
  height:34px;
  border-radius:45px 52px 5px 5px;
  background:#151a1e;
  border:2px solid #050607;
}

.windshield{
  position:absolute;
  left:54px;
  top:3px;
  width:50px;
  height:25px;
  transform:skewX(-12deg);
  border-radius:5px;
  background:linear-gradient(135deg,#49687d,#111a21);
  border:1px solid #718696;
}

.sideWindow{
  position:absolute;
  left:12px;
  top:4px;
  width:38px;
  height:24px;
  border-radius:4px;
  background:linear-gradient(135deg,#49687d,#111a21);
  border:1px solid #718696;
}

/* FRONT */
.front{
  position:absolute;
  right:-2px;
  top:16px;
  width:30px;
  height:22px;
  border-radius:4px 8px 8px 4px;
  background:#0b0d0f;
  border:2px solid #555;
}

.grille{
  position:absolute;
  right:2px;
  top:20px;
  width:22px;
  height:16px;
  border-radius:3px;
  border:2px solid #888;
  background:repeating-linear-gradient(
    0deg,
    #aaa 0 2px,
    #222 2px 4px
  );
}

.light{
  position:absolute;
  right:27px;
  top:12px;
  width:30px;
  height:8px;
  border-radius:8px;
  background:#f4fbff;
  box-shadow:0 0 12px #fff;
  transform:skewX(-18deg);
}

.lightBack{
  position:absolute;
  left:4px;
  top:13px;
  width:15px;
  height:9px;
  border-radius:4px;
  background:#e00000;
  box-shadow:0 0 7px #ff2222;
}

.handle{
  position:absolute;
  left:106px;
  top:19px;
  width:12px;
  height:3px;
  border-radius:4px;
  background:#aaa;
}

/* WHEELS */
.wheel{
  position:absolute;
  bottom:-9px;
  width:34px;
  height:34px;
  border-radius:50%;
  background:#070707;
  border:4px solid #25282b;
  box-shadow:inset 0 0 0 5px #101010;
}

.wheel:after{
  content:"";
  position:absolute;
  width:11px;
  height:11px;
  left:7px;
  top:7px;
  border-radius:50%;
  background:#aaa;
  border:2px solid #444;
}

.wheel1{left:20px}
.wheel2{right:20px}

/* CONTROLS */
#joystick{
  position:absolute;
  z-index:100;
  left:22px;
  bottom:22px;
  width:108px;
  height:108px;
  border-radius:50%;
  background:rgba(255,255,255,.18);
  border:2px solid rgba(255,255,255,.45);
}

#stick{
  position:absolute;
  width:52px;
  height:52px;
  left:26px;
  top:26px;
  border-radius:50%;
  background:rgba(255,255,255,.7);
  box-shadow:0 4px 12px rgba(0,0,0,.35);
}

#action{
  position:absolute;
  z-index:100;
  right:25px;
  bottom:30px;
  width:92px;
  height:92px;
  border-radius:50%;
  border:3px solid rgba(255,255,255,.55);
  background:rgba(10,10,10,.82);
  color:white;
  font-weight:bold;
  font-size:15px;
}
</style>
</head>

<body>

<div id="game">

<div class="sun"></div>
<div class="cloud cloud1"></div>
<div class="cloud cloud2"></div>

<div class="city">
  <div class="building b1"></div>
  <div class="building b2"></div>
  <div class="building b3"></div>
  <div class="building b4"></div>
  <div class="building b5"></div>
</div>

<div class="sidewalk"></div>
<div class="road"></div>

<div class="hud">
  <div class="hudBox">🇳🇬 ABUJA</div>
  <div class="hudBox">💰 ₦25,000</div>
</div>

<div id="status">Walk to the Velar and press ACTION</div>

<!-- PLAYER -->
<div id="player" style="left:35%;top:64%;">
  <div class="playerShadow"></div>
  <div class="head">
    <div class="eye eye1"></div>
    <div class="eye eye2"></div>
  </div>
  <div class="hair"></div>
  <div class="body"></div>
  <div class="arm arm1"></div>
  <div class="arm arm2"></div>
  <div class="leg leg1"></div>
  <div class="leg leg2"></div>
  <div class="shoe shoe1"></div>
  <div class="shoe shoe2"></div>
</div>

<!-- RANGE ROVER VELAR STYLE -->
<div id="car" style="left:57%;top:65%;">
  <div class="carShadow"></div>

  <div class="carBody">

    <div class="roof">
      <div class="sideWindow"></div>
      <div class="windshield"></div>
    </div>

    <div class="light"></div>
    <div class="lightBack"></div>
    <div class="front"></div>
    <div class="grille"></div>
    <div class="handle"></div>

    <div class="wheel wheel1"></div>
    <div class="wheel wheel2"></div>

  </div>
</div>

<div id="joystick">
  <div id="stick"></div>
</div>

<button id="action">ACTION</button>

</div>

<script>
const player=document.getElementById("player");
const car=document.getElementById("car");
const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");
const action=document.getElementById("action");
const statusText=document.getElementById("status");

let playerX=35;
let playerY=64;

let carX=57;
let carY=65;

let driving=false;

let moveX=0;
let moveY=0;

function update(){

  if(driving){

    /* CAR = MUCH FASTER */
    carX += moveX * 0.32;
    carY += moveY * 0.26;

    carX=Math.max(1,Math.min(82,carX));
    carY=Math.max(48,Math.min(83,carY));

    car.style.left=carX+"%";
    car.style.top=carY+"%";

  }else{

    /* HUMAN = SLOWER */
    playerX += moveX * 0.10;
    playerY += moveY * 0.08;

    playerX=Math.max(1,Math.min(94,playerX));
    playerY=Math.max(48,Math.min(84,playerY));

    player.style.left=playerX+"%";
    player.style.top=playerY+"%";
  }
}

setInterval(update,30);

/* JOYSTICK */
let active=false;

function moveStick(x,y){

  const r=joystick.getBoundingClientRect();

  let dx=x-(r.left+r.width/2);
  let dy=y-(r.top+r.height/2);

  const distance=Math.sqrt(dx*dx+dy*dy);
  const max=27;

  if(distance>max){
    dx=dx/distance*max;
    dy=dy/distance*max;
  }

  stick.style.transform=`translate(${dx}px,${dy}px)`;

  moveX=dx/max;
  moveY=dy/max;
}

joystick.addEventListener("touchstart",e=>{
  active=true;
  const t=e.touches[0];
  moveStick(t.clientX,t.clientY);
});

joystick.addEventListener("touchmove",e=>{
  if(!active)return;
  const t=e.touches[0];
  moveStick(t.clientX,t.clientY);
});

joystick.addEventListener("touchend",()=>{
  active=false;
  moveX=0;
  moveY=0;
  stick.style.transform="translate(0,0)";
});

/* ACTION */
action.addEventListener("click",()=>{

  if(!driving){

    driving=true;
    player.style.display="none";
    statusText.textContent="🚙 Driving the Velar";

  }else{

    driving=false;

    playerX=carX+8;
    playerY=carY+2;

    player.style.left=playerX+"%";
    player.style.top=playerY+"%";

    player.style.display="block";

    statusText.textContent="Walk to the Velar and press ACTION";
  }
});
</script>

</body>
</html>
